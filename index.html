<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>FRIDAY · ผู้ช่วยส่วนตัว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0718; --vi:#a855f7; --vi2:#7c4dff; --mag:#d872ff; --dim:#8b7fa8; --txt:#ece7f7;
    --line:rgba(168,85,247,.20); --panel:rgba(30,18,54,.55); --err:#ff7597;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; color:var(--txt);
    background:radial-gradient(ellipse at 50% 32%, #1c1038 0%, #100a22 55%, #070312 100%);
    font-family:"Kanit","Segoe UI",Roboto,"Noto Sans Thai",system-ui,sans-serif; }
  #stage{ position:fixed; inset:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .title{ position:absolute; top:118px; left:0; right:0; text-align:center; pointer-events:none; }
  .title b{ font-family:"Orbitron","Kanit",sans-serif; font-size:17px; font-weight:700; letter-spacing:.14em; color:#fff; text-shadow:0 0 18px rgba(168,85,247,.6); }
  .title span{ display:block; font-family:"Orbitron","Kanit",sans-serif; font-size:9px; font-weight:500; letter-spacing:.3em; color:var(--dim); margin-top:5px; text-transform:uppercase; }
  .status{ position:absolute; left:0; right:0; bottom:126px; text-align:center; padding:0 32px;
    font-size:15px; line-height:1.55; color:#cdbff0; text-shadow:0 0 12px rgba(124,77,255,.4); pointer-events:none; }
  .status .sub{ font-size:12px; letter-spacing:.25em; color:var(--dim); text-transform:uppercase; }
  .panel{ position:absolute; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px 13px;
    backdrop-filter:blur(10px); box-shadow:0 8px 30px rgba(0,0,0,.35), inset 0 0 20px rgba(168,85,247,.05); }
  .panel .lbl{ font-size:9px; letter-spacing:.22em; color:var(--dim); text-transform:uppercase; margin-bottom:3px; }
  .tl{ top:16px; left:16px; min-width:132px; }
  .clock{ font-size:22px; font-weight:600; letter-spacing:.05em; color:#fff; text-shadow:0 0 12px rgba(168,85,247,.4); }
  .date{ font-size:10.5px; color:var(--dim); margin-top:2px; }
  .tr{ top:16px; right:16px; min-width:140px; text-align:right; }
  .temp{ font-size:22px; font-weight:600; color:#fff; }
  .wmeta{ font-size:10.5px; color:var(--dim); margin-top:2px; }
  #conv{ position:absolute; top:0; right:0; height:100%; width:min(380px,90vw); background:rgba(14,8,28,.92); backdrop-filter:blur(14px);
    border-left:1px solid var(--line); transform:translateX(100%); transition:transform .3s ease; display:flex; flex-direction:column; z-index:5; }
  #conv.open{ transform:translateX(0); }
  #conv .head{ padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  #conv .head b{ letter-spacing:.14em; color:#fff; font-size:14px; }
  #conv .head .x{ margin-left:auto; cursor:pointer; color:var(--dim); font-size:20px; }
  #log{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg{ max-width:86%; padding:11px 14px; font-size:14px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word; }
  .me{ align-self:flex-end; background:linear-gradient(135deg,#8b5cf6,#6d3ff5); color:#fff; border-radius:18px 18px 5px 18px; box-shadow:0 6px 18px rgba(124,77,255,.35); }
  .ai{ align-self:flex-start; background:rgba(255,255,255,.055); border:1px solid rgba(168,85,247,.14); color:#e7dffb; border-radius:18px 18px 18px 5px; }
  .ai.err{ border-color:rgba(255,117,151,.45); color:#ffbdcd; }
  .dock{ position:absolute; left:0; right:0; bottom:30px; display:flex; gap:26px; align-items:center; justify-content:center; z-index:6; }
  .mic{ width:78px; height:78px; border-radius:50%; border:none; cursor:pointer; position:relative;
    background:radial-gradient(circle at 50% 35%, #b98bff, #7c3aed 60%, #5b21b6); color:#fff;
    box-shadow:0 10px 34px rgba(124,58,237,.55), inset 0 -4px 12px rgba(0,0,0,.25); transition:transform .12s;
    display:flex; align-items:center; justify-content:center; }
  .mic:active{ transform:scale(.94); }
  .mic.rec{ background:radial-gradient(circle at 50% 35%, #ff9ec4, #f43f8e 60%, #be185d); }
  /* แถบคลื่นเสียงแทนไอคอนไมค์ */
  .eq{ display:flex; align-items:center; gap:4px; height:30px; }
  .eq i{ width:4px; height:10px; border-radius:3px; background:#fff; box-shadow:0 0 8px rgba(255,255,255,.55);
    transform-origin:center; animation:eq 1.4s ease-in-out infinite; }
  .eq i:nth-child(1){ animation-delay:-.9s; } .eq i:nth-child(2){ animation-delay:-.5s; }
  .eq i:nth-child(3){ animation-delay:-.1s; } .eq i:nth-child(4){ animation-delay:-.7s; }
  .eq i:nth-child(5){ animation-delay:-.3s; }
  @keyframes eq{ 0%,100%{ transform:scaleY(.45); } 50%{ transform:scaleY(1.5); } }
  .mic.rec .eq i{ animation-duration:.55s; }
  .sidebtn{ width:52px; height:52px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:#cdbff0;
    cursor:pointer; backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; }
  .sidebtn svg{ width:22px; height:22px; }
  #wrap{ position:absolute; left:16px; right:16px; bottom:118px; display:flex; gap:9px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:6; }
  #wrap.show{ opacity:1; pointer-events:auto; }
  #q{ flex:1; padding:13px 16px; border-radius:24px; border:1px solid var(--line); background:rgba(20,12,38,.9); color:var(--txt); font-size:15px; outline:none; }
  #q:focus{ border-color:var(--vi); box-shadow:0 0 0 3px rgba(124,77,255,.18); }
  #send{ width:48px; height:48px; border-radius:50%; border:none; background:linear-gradient(135deg,#8b5cf6,#6d3ff5); color:#fff; cursor:pointer;
    box-shadow:0 6px 18px rgba(124,77,255,.4); display:flex; align-items:center; justify-content:center; }
  #send svg{ width:20px; height:20px; }
  @media (max-width:560px){ .tl,.tr{ transform:scale(.9); } .tl{transform-origin:top left;} .tr{transform-origin:top right;} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="orb"></canvas>
  <div class="title"><b>F.R.I.D.A.Y</b><span>Voice Assistant</span></div>
  <div class="panel tl"><div class="lbl">Local Time</div><div class="clock" id="clock">--:--:--</div><div class="date" id="date">—</div></div>
  <div class="panel tr"><div class="lbl">Weather · Bangkok</div><div class="temp" id="temp">--°</div><div class="wmeta" id="wmeta">กำลังโหลด…</div></div>
  <div class="status"><div class="sub">STATUS · <b id="mode">READY</b></div></div>
  <div id="conv"><div class="head"><b>บทสนทนา</b><span class="x" id="convX">×</span></div><div id="log"></div></div>
  <div id="wrap"><input id="q" placeholder="พิมพ์คำถาม…" autocomplete="off"/>
    <button id="send" title="ส่ง"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
  </div>
  <div class="dock">
    <button class="sidebtn" id="kbd" title="พิมพ์">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 9.5h.01M9 9.5h.01M12 9.5h.01M15 9.5h.01M18 9.5h.01M6.5 14.5h11"/></svg>
    </button>
    <button class="mic" id="mic" title="กดพูด"><span class="eq"><i></i><i></i><i></i><i></i><i></i></span></button>
    <button class="sidebtn" id="convToggle" title="บทสนทนา">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a8.5 8.5 0 0 1-.9-4A8.38 8.38 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/></svg>
    </button>
  </div>
</div>
<script>
  var ASK = "https://nysgeaazltcuhwaottmy.supabase.co/functions/v1/ask";
  var ANON = "sb_publishable_s3HlXCCNXQvuuht8dmkb9g_ocqEvWA9";

  /* passphrase (เก็บในเครื่อง ไม่ฝังในหน้าเว็บ) */
  function getPass(){ try{ return localStorage.getItem("jarvis_pass")||""; }catch(e){ return ""; } }
  function setPass(p){ try{ localStorage.setItem("jarvis_pass", p); }catch(e){} }
  function ensurePass(){ var p=getPass(); if(!p){ p=prompt("ใส่รหัสผ่านผู้ช่วย (passphrase)")||""; if(p) setPass(p); } return p; }

  /* ---------- ทรงกลมของไหลควันเรืองแสง (ขอบนุ่ม ไม่มีเส้นขอบ) ---------- */
  var cv=document.getElementById("orb"), cx=cv.getContext("2d"), W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
  function resize(){ W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener("resize", resize); resize();
  var mode="idle", t=0;
  var blobs=[]; for(var i=0;i<16;i++){ blobs.push({ ph:i*0.7, sp:0.5+((i*37)%50)/100, rad:0.30+((i*29)%40)/100, orb:0.20+((i*53)%55)/100, hue:i%3 }); }
  var HUES=["168,85,247","124,77,255","216,120,255"];
  var cx0=0, cy0=0, R=0;
  function orbPath(rMul){ cx.beginPath(); var N=96;
    for(var k=0;k<=N;k++){ var ang=k/N*Math.PI*2;
      var wob=1+0.016*Math.sin(ang*5+t*0.9)+0.011*Math.sin(ang*8-t*1.2)+0.007*Math.sin(ang*3+t*0.5);
      var rr=R*rMul*wob; var x=cx0+Math.cos(ang)*rr, y=cy0+Math.sin(ang)*rr;
      if(k===0) cx.moveTo(x,y); else cx.lineTo(x,y); }
    cx.closePath(); }
  function draw(){ t+=0.016; cx.clearRect(0,0,W,H);
    cx0=W/2; cy0=H/2; var base=Math.min(W,H)*0.16; R=base*2.05;
    var speed=mode==="thinking"?2.2:mode==="listening"?1.55:mode==="speaking"?1.9:1;
    var lift=mode==="idle"?0.9:1.15;
    // แสงเรืองรอบนอก (ฟุ้ง ไม่มีขอบชัด)
    var og=cx.createRadialGradient(cx0,cy0,R*0.25,cx0,cy0,R*2.05);
    og.addColorStop(0,"rgba(150,80,255,"+(0.24*lift)+")"); og.addColorStop(0.5,"rgba(110,50,220,"+(0.09*lift)+")"); og.addColorStop(1,"rgba(90,40,200,0)");
    cx.fillStyle=og; cx.fillRect(0,0,W,H);
    // รูปทรงของไหลขอบหยัก
    cx.save(); orbPath(1); cx.clip();
    var bg=cx.createRadialGradient(cx0-R*0.32,cy0-R*0.32,R*0.1,cx0,cy0,R*1.05);
    bg.addColorStop(0,"#341a63"); bg.addColorStop(1,"#0a0518"); cx.fillStyle=bg; cx.fillRect(cx0-R*1.2,cy0-R*1.2,2.4*R,2.4*R);
    cx.globalCompositeOperation="lighter";
    for(var i=0;i<blobs.length;i++){ var b=blobs[i];
      var a=t*speed*0.55*b.sp + b.ph*Math.PI;
      var rr=R*b.orb*(0.6+0.4*Math.sin(t*0.7*b.sp+b.ph*3));
      var bx=cx0+Math.cos(a)*rr, by=cy0+Math.sin(a*1.08+b.ph)*rr;
      var rad=R*(b.rad*(0.8+0.3*Math.sin(t*1.1+b.ph*2)))*lift;
      var g=cx.createRadialGradient(bx,by,0,bx,by,rad); var hue=HUES[b.hue];
      g.addColorStop(0,"rgba("+hue+",0.20)"); g.addColorStop(0.6,"rgba("+hue+",0.06)"); g.addColorStop(1,"rgba("+hue+",0)");
      cx.fillStyle=g; cx.beginPath(); cx.arc(bx,by,rad,0,7); cx.fill();
    }
    // แกนกลางสว่าง
    var pc=0.42+0.14*Math.sin(t*(mode==="speaking"?6:3));
    var core=cx.createRadialGradient(cx0,cy0-R*0.05,0,cx0,cy0,R*0.7);
    core.addColorStop(0,"rgba(236,214,255,"+pc+")"); core.addColorStop(0.4,"rgba(168,90,255,0.22)"); core.addColorStop(1,"rgba(120,60,230,0)");
    cx.fillStyle=core; cx.beginPath(); cx.arc(cx0,cy0,R*0.7,0,7); cx.fill();
    // ไฮไลต์ขอบด้านในแบบเรืองแสง (ไม่ใช่เส้นขอบ)
    var rl=cx.createRadialGradient(cx0,cy0,R*0.72,cx0,cy0,R*1.02);
    rl.addColorStop(0,"rgba(200,150,255,0)"); rl.addColorStop(0.8,"rgba(200,150,255,0)"); rl.addColorStop(1,"rgba(220,180,255,0.42)");
    cx.fillStyle=rl; cx.fillRect(cx0-R*1.2,cy0-R*1.2,2.4*R,2.4*R);
    cx.globalCompositeOperation="source-over"; cx.restore();
    requestAnimationFrame(draw);
  }
  draw();

  var modeEl=document.getElementById("mode");
  function setMode(m,label){ mode=m; modeEl.textContent=label||m.toUpperCase(); }

  /* นาฬิกา */
  function two(n){ return (n<10?"0":"")+n; }
  var days=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
  var months=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  function tick(){ var d=new Date();
    document.getElementById("clock").textContent=two(d.getHours())+":"+two(d.getMinutes())+":"+two(d.getSeconds());
    document.getElementById("date").textContent="วัน"+days[d.getDay()]+" "+d.getDate()+" "+months[d.getMonth()]+" "+(d.getFullYear()+543);
  }
  tick(); setInterval(tick,1000);

  var wcode={0:"ท้องฟ้าโปร่ง",1:"เมฆบางส่วน",2:"เมฆบางส่วน",3:"เมฆมาก",45:"หมอก",48:"หมอก",51:"ฝนปรอย",61:"ฝนตก",63:"ฝนตก",65:"ฝนหนัก",80:"ฝนซู่",95:"พายุฝน"};
  fetch("https://api.open-meteo.com/v1/forecast?latitude=13.7563&longitude=100.5018&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=Asia/Bangkok")
    .then(function(r){return r.json();}).then(function(d){ var c=d.current;
      document.getElementById("temp").textContent=Math.round(c.temperature_2m)+"°C";
      document.getElementById("wmeta").textContent=(wcode[c.weather_code]||"—")+" · ชื้น "+c.relative_humidity_2m+"% · ลม "+c.wind_speed_10m+" กม./ชม.";
    }).catch(function(){ document.getElementById("wmeta").textContent="ดึงอากาศไม่สำเร็จ"; });

  var conv=document.getElementById("conv"), log=document.getElementById("log");
  function openConv(){ conv.classList.add("open"); }
  document.getElementById("convToggle").onclick=function(){ conv.classList.toggle("open"); };
  document.getElementById("convX").onclick=function(){ conv.classList.remove("open"); };
  function bubble(cls,text){ var d=document.createElement("div"); d.className="msg "+cls; d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }

  var wrap=document.getElementById("wrap"), q=document.getElementById("q");
  document.getElementById("kbd").onclick=function(){ wrap.classList.toggle("show"); if(wrap.classList.contains("show")) q.focus(); };
  document.getElementById("send").onclick=submit;
  q.addEventListener("keydown",function(e){ if(e.key==="Enter") submit(); });
  function submit(){ var text=q.value.trim(); if(!text) return; q.value=""; ensurePlayCtx(); go(text); }

  // ทำความสะอาดข้อความก่อนอ่านออกเสียง: ตัดสัญลักษณ์จัดรูปแบบ/อักขระพิเศษ/อีโมจิ ให้ฟังเป็นธรรมชาติ
  function cleanForSpeech(s){
    if(!s) return "";
    s=s.replace(/```[\s\S]*?```/g," ");
    s=s.replace(/`([^`]*)`/g,"$1");
    s=s.replace(/\*\*([^*]*)\*\*/g,"$1").replace(/\*([^*]*)\*/g,"$1");
    s=s.replace(/__([^_]*)__/g,"$1").replace(/_([^_]*)_/g,"$1");
    s=s.replace(/^\s{0,3}#{1,6}\s*/gm,"");
    s=s.replace(/^\s*[-*•·▪◦]\s+/gm,"");
    s=s.replace(/^\s*\d+[.)]\s+/gm,"");
    s=s.replace(/https?:\/\/\S+/g," ลิงก์ ");
    s=s.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{FE0F}\u{20E3}]/gu," ");
    s=s.replace(/[#*_`~>|^=\[\]{}<>]/g," ");
    s=s.replace(/\s*[\r\n]+\s*/g,". ");
    s=s.replace(/\s*[:：]\s*/g,", ");
    s=s.replace(/\s*[–—]\s*/g," ");
    s=s.replace(/\.{2,}/g,".").replace(/\s{2,}/g," ").replace(/\s+([.,!?])/g,"$1");
    s=s.replace(/,\s*\./g,".").replace(/(\.\s*){2,}/g,". ").replace(/^[\s,.]+/,"");
    return s.trim();
  }
  // ตรวจภาษาหลักของข้อความ (ไทย/อังกฤษ) ใช้เลือกภาษาไมค์อัตโนมัติตามบริบท
  var micLang="th-TH";
  function dominantLang(s){ var th=((s||"").match(/[฀-๿]/g)||[]).length, en=((s||"").match(/[A-Za-z]/g)||[]).length; return (en>th && en>4)?"en-US":"th-TH"; }

  // แบ่งข้อความเป็นช่วงไทย/อังกฤษ เพื่อออกเสียงให้ถูกสำเนียง (ช่วยเรื่องฝึกออกเสียงภาษาอังกฤษ)
  function segmentByLang(s){
    var segs=[], cur="", curLang=null;
    function flush(){ if(cur.replace(/\s/g,"")!=="") segs.push({ text:cur.trim(), lang:(curLang==="en"?"en-US":"th-TH") }); cur=""; }
    for(var i=0;i<s.length;i++){ var ch=s[i];
      var lang = /[฀-๿]/.test(ch) ? "th" : /[A-Za-z]/.test(ch) ? "en" : null;
      if(lang===null){ cur+=ch; continue; }
      if(curLang && lang!==curLang) flush();
      curLang=lang; cur+=ch;
    }
    flush();
    return segs;
  }
  // ---------- เสียงพูด: ใช้ Gemini TTS (ธรรมชาติ หลายภาษา) มีเสียงเบราว์เซอร์เป็นตัวสำรอง ----------
  var TTS = "https://nysgeaazltcuhwaottmy.supabase.co/functions/v1/tts";
  var playCtx=null, currentSrc=null;
  function ensurePlayCtx(){ try{ if(!playCtx) playCtx=new (window.AudioContext||window.webkitAudioContext)(); if(playCtx.state==="suspended") playCtx.resume(); }catch(e){} return playCtx; }
  function stopSpeaking(){ try{ if(currentSrc){ currentSrc.onended=null; currentSrc.stop(); } }catch(e){} currentSrc=null; try{ speechSynthesis.cancel(); }catch(e){} }
  function playPCM(b64, sampleRate){
    var ctx=ensurePlayCtx(); if(!ctx) return false;
    try{
      var bin=atob(b64), n=Math.floor(bin.length/2);
      var buf=ctx.createBuffer(1,n,sampleRate||24000), ch=buf.getChannelData(0);
      for(var i=0;i<n;i++){ var val=(bin.charCodeAt(i*2+1)<<8)|bin.charCodeAt(i*2); if(val>=0x8000) val-=0x10000; ch[i]=val/32768; }
      var src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination);
      src.onended=function(){ if(currentSrc===src){ currentSrc=null; setMode("idle","READY"); } };
      currentSrc=src; src.start(); return true;
    }catch(e){ return false; }
  }
  function speak(text){
    var say=cleanForSpeech(text); if(!say){ setMode("idle","READY"); return; }
    stopSpeaking(); setMode("speaking","SPEAKING");
    var pass=getPass();
    fetch(TTS,{ method:"POST", headers:{ "content-type":"application/json","authorization":"Bearer "+ANON,"apikey":ANON,"x-orch-secret":pass },
      body: JSON.stringify({ text: say }) })
    .then(function(r){ return r.json().then(function(d){ return {status:r.status,d:d}; }); })
    .then(function(o){ if(o.status===200 && o.d && o.d.audio){ if(!playPCM(o.d.audio, o.d.sampleRate)) browserSpeak(say); } else { browserSpeak(say); } })
    .catch(function(){ browserSpeak(say); });
  }
  // เสียงเบราว์เซอร์ (สำรอง) แบ่งไทย/อังกฤษให้ออกเสียงถูกสำเนียง
  function browserSpeak(say){
    if(!window.speechSynthesis){ setMode("idle","READY"); return; }
    var segs=segmentByLang(say); if(!segs.length){ setMode("idle","READY"); return; }
    try{ speechSynthesis.cancel();
      segs.forEach(function(sg,idx){ var u=new SpeechSynthesisUtterance(sg.text); u.lang=sg.lang; u.rate=(sg.lang==="en-US"?0.92:1.03);
        if(idx===segs.length-1){ u.onend=function(){ setMode("idle","READY"); }; u.onerror=function(){ setMode("idle","READY"); }; }
        speechSynthesis.speak(u); });
    }catch(e){ setMode("idle","READY"); }
  }

  function go(question){
    var pass=ensurePass(); if(!pass){ bubble("ai err","ต้องใส่รหัสผ่านก่อนใช้งาน"); return; }
    openConv(); bubble("me",question); setMode("thinking","THINKING");
    fetch(ASK,{ method:"POST", headers:{ "content-type":"application/json","authorization":"Bearer "+ANON,"apikey":ANON,"x-orch-secret":pass },
      body: JSON.stringify({question:question}) })
    .then(function(r){ return r.json().then(function(d){ return {status:r.status, d:d}; }); })
    .then(function(o){ var data=o.d;
      if(o.status===401){ try{ localStorage.removeItem("jarvis_pass"); }catch(e){} bubble("ai err","รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง"); setMode("idle","READY"); return; }
      if(data.error){ bubble("ai err","เกิดข้อผิดพลาด: "+data.error); setMode("idle","READY"); return; }
      bubble("ai", data.answer||"(ไม่มีคำตอบ)"); speak(data.answer||""); micLang=dominantLang(data.answer||"");
    }).catch(function(err){ bubble("ai err","เชื่อมต่อไม่สำเร็จ: "+err.message); setMode("idle","READY"); });
  }

  // ---------- ไมค์: อัดเสียง -> ส่งให้ Gemini ถอดข้อความ + ตรวจภาษาอัตโนมัติ (ไทย/อังกฤษ/ปนกัน) ----------
  var STT = "https://nysgeaazltcuhwaottmy.supabase.co/functions/v1/stt";
  var mic=document.getElementById("mic");
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var recording=false, recCtx=null, recStream=null, recNode=null, recSrc=null, recChunks=[], sttOff=false;

  function floatTo16(input){ var b=new ArrayBuffer(input.length*2), v=new DataView(b), o=0;
    for(var i=0;i<input.length;i++,o+=2){ var s=Math.max(-1,Math.min(1,input[i])); v.setInt16(o, s<0?s*0x8000:s*0x7FFF, true); } return b; }
  function downsample(buf,inR,outR){ if(outR>=inR) return buf; var ratio=inR/outR, nl=Math.round(buf.length/ratio), res=new Float32Array(nl), oi=0, ii=0;
    while(oi<nl){ var ni=Math.round((oi+1)*ratio), acc=0, c=0; for(var i=ii;i<ni&&i<buf.length;i++){ acc+=buf[i]; c++; } res[oi]=c?acc/c:0; oi++; ii=ni; } return res; }
  function encodeWAV(sm,rate){ var pcm=floatTo16(sm), dl=pcm.byteLength, buf=new ArrayBuffer(44+dl), v=new DataView(buf);
    function ws(o,s){ for(var i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); }
    ws(0,"RIFF"); v.setUint32(4,36+dl,true); ws(8,"WAVE"); ws(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); ws(36,"data"); v.setUint32(40,dl,true);
    new Uint8Array(buf).set(new Uint8Array(pcm),44); return new Blob([buf],{type:"audio/wav"}); }
  function stopTracks(){ try{ recNode&&recNode.disconnect(); }catch(e){} try{ recSrc&&recSrc.disconnect(); }catch(e){}
    try{ recStream&&recStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} }

  async function startRec(){
    recStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    recCtx = new (window.AudioContext||window.webkitAudioContext)();
    recSrc = recCtx.createMediaStreamSource(recStream);
    recNode = recCtx.createScriptProcessor(4096,1,1);
    recChunks=[];
    recNode.onaudioprocess=function(e){ recChunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    recSrc.connect(recNode); recNode.connect(recCtx.destination);
    recording=true; mic.classList.add("rec"); setMode("listening","LISTENING");
  }
  function stopRecAndSend(){
    recording=false; mic.classList.remove("rec"); setMode("thinking","THINKING");
    var inRate=recCtx?recCtx.sampleRate:48000; stopTracks();
    var len=0; recChunks.forEach(function(c){ len+=c.length; }); var merged=new Float32Array(len), off=0;
    recChunks.forEach(function(c){ merged.set(c,off); off+=c.length; }); recChunks=[];
    try{ recCtx&&recCtx.close(); }catch(e){}
    if(len<1600){ setMode("idle","READY"); return; }               // สั้นเกินไป (ยังไม่ทันพูด)
    var wav=encodeWAV(downsample(merged,inRate,16000),16000);
    var fr=new FileReader(); fr.onloadend=function(){ sendSTT(String(fr.result).split(",")[1]); }; fr.readAsDataURL(wav);
  }
  function sendSTT(b64){
    var pass=ensurePass(); if(!pass){ bubble("ai err","ต้องใส่รหัสผ่านก่อนใช้งาน"); setMode("idle","READY"); return; }
    fetch(STT,{ method:"POST", headers:{ "content-type":"application/json","authorization":"Bearer "+ANON,"apikey":ANON,"x-orch-secret":pass },
      body: JSON.stringify({ audio:b64, mime:"audio/wav" }) })
    .then(function(r){ return r.json().then(function(d){ return {status:r.status,d:d}; }); })
    .then(function(o){
      if(o.status===401){ try{ localStorage.removeItem("jarvis_pass"); }catch(e){} bubble("ai err","รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง"); setMode("idle","READY"); return; }
      if(o.d && o.d.error){
        if((o.status===500||o.status===404) && SR){ sttOff=true; bubble("ai err","ยังไม่ได้ตั้งค่า Gemini — สลับไปใช้เสียงไทยในเบราว์เซอร์ชั่วคราว"); }
        else { bubble("ai err","ถอดเสียงไม่สำเร็จ: "+o.d.error); }
        setMode("idle","READY"); return;
      }
      var text=((o.d&&o.d.text)||"").trim();
      if(text){ go(text); } else { setMode("idle","READY"); }
    })
    .catch(function(e){ if(SR){ sttOff=true; } bubble("ai err","เชื่อมต่อถอดเสียงไม่สำเร็จ: "+e.message); setMode("idle","READY"); });
  }

  // ตัวรู้จำเสียงในเบราว์เซอร์ (ใช้เป็นตัวสำรองเมื่อยังไม่ได้ตั้งค่า Gemini หรืออุปกรณ์อัดเสียงไม่ได้)
  function webSpeechListen(){
    if(!SR){ bubble("ai err","อุปกรณ์นี้อัดเสียงไม่ได้"); setMode("idle","READY"); return; }
    var rec=new SR(); rec.lang="th-TH"; rec.interimResults=true; rec.continuous=false; var got="";
    rec.onstart=function(){ recording=true; mic.classList.add("rec"); setMode("listening","LISTENING"); };
    rec.onresult=function(ev){ var f=""; for(var i=0;i<ev.results.length;i++){ if(ev.results[i].isFinal) f+=ev.results[i][0].transcript; } if(f) got=f; };
    rec.onend=function(){ recording=false; mic.classList.remove("rec"); var t=got.trim(); if(t){ go(t); } else { setMode("idle","READY"); } };
    rec.onerror=function(){ recording=false; mic.classList.remove("rec"); setMode("idle","READY"); };
    mic._sr=rec; try{ rec.start(); }catch(e){}
  }

  var hasRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && (window.AudioContext||window.webkitAudioContext));
  mic.onclick=function(){
    if(recording){ if(mic._sr){ try{ mic._sr.stop(); }catch(e){} return; } stopRecAndSend(); return; }
    stopSpeaking(); ensurePlayCtx();
    if(sttOff || !hasRecord){ mic._sr=null; webSpeechListen(); return; }
    mic._sr=null;
    startRec().catch(function(e){ recording=false; mic.classList.remove("rec");
      if(SR){ webSpeechListen(); } else { bubble("ai err","เปิดไมค์ไม่ได้: "+e.message); setMode("idle","READY"); } });
  };
  if(!hasRecord && !SR){ mic.title="เบราว์เซอร์นี้ไม่รองรับเสียง"; }

  bubble("ai","สวัสดีครับ ผม Friday ผู้ช่วยส่วนตัวของคุณ ถามได้เลยทั้งพิมพ์หรือกดไมค์พูด เช่น วาฟเฟิลเดือนนี้ขายดีไหม หรือ เซเว่นมีใครลาบ้างสัปดาห์นี้");
</script>
