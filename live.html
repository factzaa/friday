  var TOOLS=[{ functionDeclarations:[
    { name:"run_query",
      description:"อ่านข้อมูลจากฐานข้อมูลของร้าน (Postgres อ่านอย่างเดียว) ส่งชื่อโปรเจกต์และ SELECT 1 คำสั่ง ใส่ LIMIT เสมอ ใช้ information_schema เพื่อดูชื่อตาราง/คอลัมน์ได้",
      parameters:{ type:"object", properties:{
        project:{ type:"string", description:"Maru Waffle, guichai-pantip, 7eleven-hr, recruitment" },
        sql:{ type:"string", description:"คำสั่ง SELECT อ่านอย่างเดียว 1 คำสั่ง" }
      }, required:["project","sql"] } },
    { name:"get_weather",
      description:"ดูสภาพอากาศปัจจุบัน (ค่าเริ่มต้นกรุงเทพฯ หรือตำแหน่งผู้ใช้)",
      parameters:{ type:"object", properties:{ latitude:{type:"number"}, longitude:{type:"number"} } } }
  ]}];

  async function runQuery(project, sql){
    var pass=getPass();
    try{ var r=await fetch(DBQ,{ method:"POST", headers:{ "content-type":"application/json","authorization":"Bearer "+ANON,"apikey":ANON,"x-orch-secret":pass }, body:JSON.stringify({ project:project, sql:sql, limit:200 }) });
      return await r.json();
    }catch(e){ return { error:"เชื่อมต่อฐานข้อมูลไม่สำเร็จ: "+e.message }; }
  }
  async function getWeather(lat,lon){
    try{ lat=(typeof lat==="number")?lat:(userLoc?userLoc.lat:13.7563); lon=(typeof lon==="number")?lon:(userLoc?userLoc.lon:100.5018);
      var r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code&timezone=auto");
      var d=await r.json(); return { current:d.current };
    }catch(e){ return { error:e.message }; }
  }

  /* เล่นเสียงสตรีม 24kHz */
  var playCtx=null, nextTime=0, playing=[];
  function ensurePlay(){ if(!playCtx) playCtx=new (window.AudioContext||window.webkitAudioContext)(); if(playCtx.state==="suspended") playCtx.resume(); return playCtx; }
  function enqueueAudio(b64){ var ctx=ensurePlay(); var bin=atob(b64), n=Math.floor(bin.length/2); if(n<1) return;
    var buf=ctx.createBuffer(1,n,24000), ch=buf.getChannelData(0);
    for(var i=0;i<n;i++){ var v=(bin.charCodeAt(i*2+1)<<8)|bin.charCodeAt(i*2); if(v>=0x8000)v-=0x10000; ch[i]=v/32768; }
    var src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination);
    var start=Math.max(ctx.currentTime, nextTime); src.start(start); nextTime=start+buf.duration; playing.push(src);
    setMode("speaking","SPEAKING");
    src.onended=function(){ var i=playing.indexOf(src); if(i>=0) playing.splice(i,1); if(!playing.length && live) setMode(micStream?"listening":"idle", micStream?"LISTENING":"READY"); };
  }
  function stopAudio(){ playing.forEach(function(s){ try{ s.onended=null; s.stop(); }catch(e){} }); playing=[]; nextTime=0; }

  /* สัญญาณเสียง (บี๊บ) — พร้อมรับคำสั่ง / จบสนทนา / ปลุก */
  function beep(kind){
    try{ var ctx=ensurePlay(); var now=ctx.currentTime;
      var seq = kind==="ready" ? [[660,0],[990,0.13]]
              : kind==="bye"   ? [[760,0],[500,0.15]]
              :                   [[880,0]];
      seq.forEach(function(p){ var o=ctx.createOscillator(), g=ctx.createGain();
        o.type="sine"; o.frequency.value=p[0]; o.connect(g); g.connect(ctx.destination);
        var st=now+p[1];
        g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.22,st+0.02); g.gain.exponentialRampToValueAtTime(0.0001,st+0.17);
        o.start(st); o.stop(st+0.2);
      });
    }catch(e){}
  }

  /* ไมค์ 16kHz */
  var micStream=null, micCtx=null, micNode=null, micSrc=null;
  function downsample(buf,inR){ var outR=16000; if(outR>=inR) return buf; var ratio=inR/outR, nl=Math.round(buf.length/ratio), res=new Float32Array(nl), oi=0, ii=0; while(oi<nl){ var ni=Math.round((oi+1)*ratio), acc=0,c=0; for(var i=ii;i<ni&&i<buf.length;i++){acc+=buf[i];c++;} res[oi]=c?acc/c:0; oi++; ii=ni; } return res; }
  function f32ToB64(f32){ var b=new ArrayBuffer(f32.length*2), v=new DataView(b); for(var i=0;i<f32.length;i++){ var s=Math.max(-1,Math.min(1,f32[i])); v.setInt16(i*2, s<0?s*0x8000:s*0x7FFF, true); } var bytes=new Uint8Array(b), bin=""; for(var j=0;j<bytes.length;j++) bin+=String.fromCharCode(bytes[j]); return btoa(bin); }
  async function startMic(){
    micStream=await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
    micCtx=new (window.AudioContext||window.webkitAudioContext)();
    micSrc=micCtx.createMediaStreamSource(micStream);
    micNode=micCtx.createScriptProcessor(4096,1,1);
    micNode.onaudioprocess=function(e){ if(!session) return; var d=downsample(e.inputBuffer.getChannelData(0), micCtx.sampleRate);
      try{ session.sendRealtimeInput({ audio:{ data:f32ToB64(d), mimeType:"audio/pcm;rate=16000" } }); }catch(err){} };
    micSrc.connect(micNode); micNode.connect(micCtx.destination);
    mic.classList.add("rec");
  }
  function stopMic(){ try{ micNode&&micNode.disconnect(); }catch(e){} try{ micSrc&&micSrc.disconnect(); }catch(e){} try{ micStream&&micStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} try{ micCtx&&micCtx.close(); }catch(e){} micStream=micCtx=micNode=micSrc=null; mic.classList.remove("rec"); }

  var ai=null, session=null, live=false, wantMic=true, pendingText=null, mic=document.getElementById("mic");
  var ending=false, curUserText="", wakeEnabled=false, wakeOn=false, wakeRec=null;
  var connecting=false, waking=false;
  var wakeSupported=("webkitSpeechRecognition" in window)||("SpeechRecognition" in window);

  /* จบบทสนทนาด้วยเสียง — พูดวลีเหล่านี้แล้ว Friday จะปิดเอง ไม่ต้องกดปุ่ม */
  var STOP=["จบการสนทนา","จบสนทนา","จบแล้ว","ปิดการสนทนา","หยุดฟัง","หยุดก่อน","พอแค่นี้","พอแล้วนะ","บายบาย","แล้วเจอกันใหม่","ไว้เจอกันใหม่","เลิกคุย","ไปก่อนนะ","ไปละนะ","fridayหยุด","fridayพอ","goodbyefriday","stoplistening","thankyoufriday"];
  /* คำปลุก — พูดตอนหน้าจอปิด/ว่างอยู่ เพื่อเปิดการสนทนาใหม่ */
  var WAKE=["friday","ไฟรเดย์","ไฟร์เดย์","เฟรดเดย์","เฟรย์เดย์","ฟรายเดย์","ศุกร์","heyfriday","okfriday"];
  function norm(s){ return (s||"").toLowerCase().replace(/[\s\.\,\!\?ะ-ฺ็-๎]/g,""); }
  function checkVoiceEnd(txt){
    if(ending || !live) return;
    var n=norm(txt);
    if(STOP.some(function(w){ return n.indexOf(norm(w))>=0; })){ ending=true; voiceEnd(); }
  }
  function voiceEnd(){ beep("bye"); bubble("ai sys","🔚 จบบทสนทนาด้วยเสียง"); openConv(); endLive(false); }

  /* ตัวฟังคำปลุก (ทำงานเฉพาะตอนว่าง ไม่ชนกับไมค์ Live) */
  function startWake(){
    if(!wakeSupported || live || wakeOn) return;
    try{
      var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      wakeRec=new SR(); wakeRec.lang="th-TH"; wakeRec.continuous=true; wakeRec.interimResults=true;
      wakeRec.onresult=function(ev){
        if(waking || live || connecting) return;
        var txt=""; for(var i=ev.resultIndex;i<ev.results.length;i++){ txt+=ev.results[i][0].transcript; }
        var n=norm(txt);
        if(WAKE.some(function(w){ return n.indexOf(norm(w))>=0; })){
          waking=true; wakeOn=false; try{ wakeRec.stop(); }catch(e){}
          beep("wake"); setTimeout(function(){ waking=false; }, 1800); connect(true);
        }
      };
      wakeRec.onerror=function(){};
      wakeRec.onend=function(){ if(wakeOn && !live){ try{ wakeRec.start(); }catch(e){} } };
      wakeOn=true; wakeRec.start();
      if(!live) setMode("idle",'READY · พูด "FRIDAY"');
    }catch(e){}
  }
  function stopWake(){ wakeOn=false; try{ wakeRec&&wakeRec.stop(); }catch(e){} }

  /* ===== เลือกเสียง Friday (Gemini prebuilt voices) ===== */
  var VOICES=[
    ["Charon","Charon · ผู้รู้ ทุ้ม (ช)"],["Orus","Orus · หนักแน่น (ช)"],["Iapetus","Iapetus · ชัดเจน (ช)"],
    ["Rasalgethi","Rasalgethi · ให้ข้อมูล (ช)"],["Sadaltager","Sadaltager · รอบรู้ (ช)"],["Alnilam","Alnilam · มั่นคง (ช)"],
    ["Schedar","Schedar · เรียบนิ่ง (ช)"],["Gacrux","Gacrux · สุขุมโตเต็มวัย (ช)"],["Algenib","Algenib · แหบเท่ (ช)"],
    ["Achird","Achird · เป็นมิตร (ช)"],["Zubenelgenubi","Zubenelgenubi · สบายๆ ลำลอง (ช)"],["Fenrir","Fenrir · มีพลัง (ช)"],
    ["Puck","Puck · สดใสร่าเริง (ช)"],["Enceladus","Enceladus · นุ่มลมหายใจ (ช)"],["Algieba","Algieba · ลื่นนุ่ม (ช)"],
    ["Umbriel","Umbriel · สบายๆ (ช)"],["Sadachbia","Sadachbia · มีชีวิตชีวา (ช)"],
    ["Kore","Kore · หนักแน่น (ญ)"],["Aoede","Aoede · โปร่งสบาย (ญ)"],["Zephyr","Zephyr · สว่างสดใส (ญ)"],
    ["Leda","Leda · วัยรุ่นสดใส (ญ)"],["Sulafat","Sulafat · อบอุ่น (ญ)"],["Vindemiatrix","Vindemiatrix · อ่อนโยน (ญ)"],
    ["Autonoe","Autonoe · สว่างสดใส (ญ)"],["Callirrhoe","Callirrhoe · สบายๆ (ญ)"],["Despina","Despina · ลื่นนุ่ม (ญ)"],
    ["Erinome","Erinome · ชัดเจน (ญ)"],["Laomedeia","Laomedeia · สดใสร่าเริง (ญ)"],["Achernar","Achernar · นุ่มเบา (ญ)"],
    ["Pulcherrima","Pulcherrima · มั่นใจกล้า (ญ)"]
  ];
  function getVoice(){ try{ return localStorage.getItem("friday_voice")||"Charon"; }catch(e){ return "Charon"; } }
  function setVoice(v){ try{ localStorage.setItem("friday_voice", v); }catch(e){} }
  function labelFor(v){ for(var i=0;i<VOICES.length;i++){ if(VOICES[i][0]===v) return VOICES[i][1]; } return v; }
  var voiceSel=document.getElementById("voiceSel");
  (function(){ for(var i=0;i<VOICES.length;i++){ var o=document.createElement("option"); o.value=VOICES[i][0]; o.textContent=VOICES[i][1]; voiceSel.appendChild(o); } voiceSel.value=getVoice(); })();
  function reconnectForVoice(){ if(!live) return; var wasMic=!!micStream; endLive(false); setTimeout(function(){ connect(wasMic); }, 450); }
  voiceSel.onchange=function(){ setVoice(voiceSel.value); bubble("ai sys","🔈 เปลี่ยนเสียงเป็น "+labelFor(voiceSel.value)); openConv();
    if(live) reconnectForVoice(); };
  function auditionVoice(){
    ensurePlay(); openConv();
    var say="พูดสั้นๆ ประโยคเดียวว่า: สวัสดีครับบอส นี่คือเสียงของผมเองครับ";
    if(live){ if(session){ try{ session.sendClientContent({ turns:[{ role:"user", parts:[{ text:say }] }], turnComplete:true }); setMode("thinking","THINKING"); return; }catch(e){} } }
    pendingText=say; connect(false);
  }
  document.getElementById("voiceTest").onclick=auditionVoice;
  function pickAudio(msg){
    if(msg.data) return msg.data;
    var parts=msg.serverContent && msg.serverContent.modelTurn && msg.serverContent.modelTurn.parts;
    if(parts){ for(var i=0;i<parts.length;i++){ var p=parts[i]; if(p.inlineData && p.inlineData.data) return p.inlineData.data; } }
    return null;
  }
  async function handleMessage(msg){
    try{
      var sc=msg.serverContent;
      if(sc){
        if(sc.interrupted){ stopAudio(); }
        if(sc.inputTranscription && sc.inputTranscription.text){ appendU(sc.inputTranscription.text); curUserText+=sc.inputTranscription.text; checkVoiceEnd(curUserText); }
        if(sc.outputTranscription && sc.outputTranscription.text){ appendF(sc.outputTranscription.text); }
        if(sc.turnComplete){ curU=null; curF=null; curUserText=""; }
      }
      var audio=pickAudio(msg); if(audio){ enqueueAudio(audio); }
      var tc=msg.toolCall || (msg.serverContent && msg.serverContent.toolCall);
      if(tc && tc.functionCalls && tc.functionCalls.length){
        setMode("thinking","THINKING");
        var responses=[];
        for(var i=0;i<tc.functionCalls.length;i++){ var fc=tc.functionCalls[i]; var a=fc.args||{};
          var label = fc.name==="run_query" ? (a.project+": "+String(a.sql||"").slice(0,60)) : fc.name;
          var dbg=bubble("ai sys","🔧 "+label+" …"); openConv();
          var out={};
          if(fc.name==="run_query"){ out=await runQuery(a.project, a.sql); }
          else if(fc.name==="get_weather"){ out=await getWeather(a.latitude, a.longitude); }
          else { out={ error:"unknown tool "+fc.name }; }
          dbg.textContent="🔧 "+(out&&out.error? ("ผิดพลาด: "+String(out.error).slice(0,120)) : ("ได้ข้อมูลแล้ว "+JSON.stringify(out).slice(0,120)));
          responses.push({ id:fc.id, name:fc.name, response:out });
        }
        try{ session.sendToolResponse({ functionResponses:responses }); }
        catch(e){ bubble("ai err","ส่งผลเครื่องมือกลับไม่สำเร็จ: "+e.message); }
      }
    }catch(e){ bubble("ai err","ประมวลผลข้อความไม่สำเร็จ: "+e.message); }
  }

  async function connect(withMic){
    if(connecting || live) return;
    connecting=true;
    wantMic=(withMic!==false);
    stopWake(); ending=false; curUserText="";
    if(wantMic) wakeEnabled=true;
    var pass=ensurePass(); if(!pass){ connecting=false; bubble("ai err","ต้องใส่รหัสผ่านก่อน"); openConv(); return; }
    setMode("thinking","CONNECTING"); ensurePlay();
    var tok;
    try{
      var tr=await fetch(LIVE_TOKEN,{ method:"POST", headers:{ "content-type":"application/json","authorization":"Bearer "+ANON,"apikey":ANON,"x-orch-secret":pass }, body:"{}" });
      tok=await tr.json();
      if(!tok.token){ throw new Error(tok.error||"ไม่ได้ token"); }
    }catch(e){ connecting=false; setMode("idle","READY"); bubble("ai err","ขอ token ไม่สำเร็จ: "+e.message); openConv(); return; }
    try{
      ai=new GoogleGenAI({ apiKey:tok.token, httpOptions:{ apiVersion:"v1beta" } });
      session=await ai.live.connect({
        model: tok.model || "gemini-3.1-flash-live-preview",
        config:{
          responseModalities:["AUDIO"],
          speechConfig:{ voiceConfig:{ prebuiltVoiceConfig:{ voiceName:getVoice() } } },
          systemInstruction: SYSTEM,
          tools: TOOLS,
          inputAudioTranscription:{},
          outputAudioTranscription:{}
        },
        callbacks:{
          onopen:function(){ live=true; connecting=false; ending=false; curUserText="";
            if(wantMic){ setMode("listening","LISTENING"); startMic().then(function(){ beep("ready"); }).catch(function(e){ bubble("ai err","เปิดไมค์ไม่ได้: "+e.message); openConv(); }); }
            else { setMode("idle","READY"); }
            if(pendingText){ var pt=pendingText; pendingText=null;
              (function trySend(n){
                if(session){ try{ session.sendClientContent({ turns:[{ role:"user", parts:[{ text:pt }] }], turnComplete:true }); setMode("thinking","THINKING"); }catch(e){ bubble("ai err","ส่งข้อความไม่สำเร็จ: "+e.message); } }
                else if(n>0){ setTimeout(function(){ trySend(n-1); }, 60); }
                else { bubble("ai err","ส่งข้อความไม่สำเร็จ: เชื่อมต่อไม่ทัน"); }
              })(25);
            }
          },
          onmessage:handleMessage,
          onerror:function(e){ bubble("ai err","การเชื่อมต่อผิดพลาด: "+((e&&e.message)||e)); openConv(); },
          onclose:function(e){ endLive(true); }
        }
      });
    }catch(e){ connecting=false; setMode("idle","READY"); bubble("ai err","เชื่อมต่อ Live ไม่สำเร็จ: "+((e&&e.message)||e)); openConv(); }
  }
  function endLive(fromClose){
    live=false; connecting=false; stopMic(); stopAudio();
    try{ if(session && !fromClose) session.close(); }catch(e){}
    session=null; setMode("idle","READY");
    if(wakeEnabled && wakeSupported) setTimeout(startWake, 1500);
  }

  /* ปุ่มไมค์ (คลื่นเสียง) */
  mic.onclick=function(){
    ensurePlay();
    if(live){
      if(!micStream){ wantMic=true; setMode("listening","LISTENING"); startMic().then(function(){ beep("ready"); }).catch(function(e){ bubble("ai err","เปิดไมค์ไม่ได้: "+e.message); openConv(); }); }
      else { endLive(false); }
    } else { stopWake(); connect(true); }
  };

  /* คีย์บอร์ด / พิมพ์ */
  var wrap=document.getElementById("wrap"), q=document.getElementById("q");
  document.getElementById("kbd").onclick=function(){ wrap.classList.toggle("show"); if(wrap.classList.contains("show")){ ensurePlay(); q.focus(); } };
  document.getElementById("send").onclick=submitText;
  q.addEventListener("keydown", function(e){ if(e.key==="Enter") submitText(); });
  function submitText(){ var text=q.value.trim(); if(!text) return; q.value=""; sendText(text); }
  function sendText(text){
    bubble("me", text); openConv();
    if(session && live){
      try{ session.sendClientContent({ turns:[{ role:"user", parts:[{ text:text }] }], turnComplete:true }); setMode("thinking","THINKING"); }
      catch(e){ bubble("ai err","ส่งข้อความไม่สำเร็จ: "+e.message); }
    } else { pendingText=text; ensurePlay(); connect(false); }
  }

  bubble("ai","สวัสดีครับบอส แตะปุ่มคลื่นเสียงเพื่อคุย พอต่อได้ผมจะส่งเสียงบี๊บบอกว่าพร้อมรับคำสั่ง เวลาจะเลิกก็พูดว่า \"จบการสนทนา\" หรือ \"บายบาย\" ได้เลยไม่ต้องกดปุ่ม และเมื่อว่างอยู่พูดว่า \"Friday\" เพื่อปลุกผมได้โดยไม่ต้องแตะจอ");
</script>
