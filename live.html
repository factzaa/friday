<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>FRIDAY · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://nysgeaazltcuhwaottmy.supabase.co">
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://generativelanguage.googleapis.com">
<link rel="dns-prefetch" href="https://generativelanguage.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0718; --vi:#a855f7; --vi2:#7c4dff; --mag:#d872ff; --dim:#8b7fa8; --txt:#ece7f7;
    --line:rgba(168,85,247,.20); --panel:rgba(30,18,54,.55); --err:#ff7597;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; color:var(--txt);
    background:radial-gradient(ellipse at 50% 32%, #1c1038 0%, #100a22 55%, #070312 100%);
    font-family:"Kanit","Segoe UI",Roboto,"Noto Sans Thai",system-ui,sans-serif; }
  #stage{ position:fixed; inset:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .title{ position:absolute; top:118px; left:0; right:0; text-align:center; pointer-events:none; }
  .title b{ font-family:"Orbitron","Kanit",sans-serif; font-size:17px; font-weight:700; letter-spacing:.14em; color:#fff; text-shadow:0 0 18px rgba(168,85,247,.6); }
  .title span{ display:block; font-family:"Orbitron","Kanit",sans-serif; font-size:9px; font-weight:500; letter-spacing:.3em; color:var(--dim); margin-top:5px; text-transform:uppercase; }
  .status{ position:absolute; left:0; right:0; bottom:126px; text-align:center; padding:0 32px;
    font-size:15px; line-height:1.55; color:#cdbff0; text-shadow:0 0 12px rgba(124,77,255,.4); pointer-events:none; }
  .status .sub{ font-size:12px; letter-spacing:.25em; color:var(--dim); text-transform:uppercase; }
  .panel{ position:absolute; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px 13px;
    backdrop-filter:blur(10px); box-shadow:0 8px 30px rgba(0,0,0,.35), inset 0 0 20px rgba(168,85,247,.05); }
  .panel .lbl{ font-size:9px; letter-spacing:.22em; color:var(--dim); text-transform:uppercase; margin-bottom:3px; }
  .tl{ top:16px; left:16px; min-width:132px; }
  .clock{ font-size:22px; font-weight:600; letter-spacing:.05em; color:#fff; text-shadow:0 0 12px rgba(168,85,247,.4); }
  .date{ font-size:10.5px; color:var(--dim); margin-top:2px; }
  .tr{ top:16px; right:16px; min-width:140px; text-align:right; }
  .temp{ font-size:22px; font-weight:600; color:#fff; }
  .wmeta{ font-size:10.5px; color:var(--dim); margin-top:2px; }
  #conv{ position:absolute; top:0; right:0; height:100%; width:min(380px,90vw); background:rgba(14,8,28,.92); backdrop-filter:blur(14px);
    border-left:1px solid var(--line); transform:translateX(100%); transition:transform .3s ease; display:flex; flex-direction:column; z-index:5; }
  #conv.open{ transform:translateX(0); }
  #conv .head{ padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  #conv .head b{ letter-spacing:.14em; color:#fff; font-size:14px; }
  #conv .head .x{ margin-left:auto; cursor:pointer; color:var(--dim); font-size:20px; }
  .voicebar{ display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  .voicebar label{ font-size:11px; color:var(--dim); letter-spacing:.1em; white-space:nowrap; }
  .voicebar select{ flex:1; background:rgba(20,12,38,.92); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px; font-family:inherit; outline:none; }
  .voicebar select:focus{ border-color:var(--vi); }
  .voicebar button{ border:1px solid var(--line); background:var(--panel); color:#cdbff0; border-radius:10px; padding:8px 10px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .voicebar button svg{ width:20px; height:20px; display:block; }
  .voicebar button:active{ transform:scale(.95); }
  #log{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg{ max-width:86%; padding:11px 14px; font-size:14px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word; }
  .me{ align-self:flex-end; background:linear-gradient(135deg,#8b5cf6,#6d3ff5); color:#fff; border-radius:18px 18px 5px 18px; box-shadow:0 6px 18px rgba(124,77,255,.35); }
  .ai{ align-self:flex-start; background:rgba(255,255,255,.055); border:1px solid rgba(168,85,247,.14); color:#e7dffb; border-radius:18px 18px 18px 5px; }
  .ai.err{ border-color:rgba(255,117,151,.45); color:#ffbdcd; }
  .ai.sys{ align-self:center; background:rgba(124,77,255,.14); color:#c9b6ff; font-size:12px; border-radius:12px; }
  .dock{ position:absolute; left:0; right:0; bottom:30px; display:flex; gap:26px; align-items:center; justify-content:center; z-index:6; }
  .mic{ width:78px; height:78px; border-radius:50%; border:none; cursor:pointer; position:relative;
    background:radial-gradient(circle at 50% 35%, #b98bff, #7c3aed 60%, #5b21b6); color:#fff;
    box-shadow:0 10px 34px rgba(124,58,237,.55), inset 0 -4px 12px rgba(0,0,0,.25); transition:transform .12s;
    display:flex; align-items:center; justify-content:center; }
  .mic:active{ transform:scale(.94); }
  .mic.rec{ background:radial-gradient(circle at 50% 35%, #86efac, #16a34a 60%, #14532d); }
  .eq{ display:flex; align-items:center; gap:4px; height:30px; }
  .eq i{ width:4px; height:10px; border-radius:3px; background:#fff; box-shadow:0 0 8px rgba(255,255,255,.55);
    transform-origin:center; animation:eq 1.4s ease-in-out infinite; }
  .eq i:nth-child(1){ animation-delay:-.9s; } .eq i:nth-child(2){ animation-delay:-.5s; }
  .eq i:nth-child(3){ animation-delay:-.1s; } .eq i:nth-child(4){ animation-delay:-.7s; }
  .eq i:nth-child(5){ animation-delay:-.3s; }
  @keyframes eq{ 0%,100%{ transform:scaleY(.45); } 50%{ transform:scaleY(1.5); } }
  .mic.rec .eq i{ animation-duration:.5s; }
  .sidebtn{ width:52px; height:52px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:#cdbff0;
    cursor:pointer; backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; }
  .sidebtn svg{ width:22px; height:22px; }
  #wrap{ position:absolute; left:16px; right:16px; bottom:118px; display:flex; gap:9px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:6; }
  #wrap.show{ opacity:1; pointer-events:auto; }
  #q{ flex:1; padding:13px 16px; border-radius:24px; border:1px solid var(--line); background:rgba(20,12,38,.9); color:var(--txt); font-size:15px; outline:none; }
  #q:focus{ border-color:var(--vi); box-shadow:0 0 0 3px rgba(124,77,255,.18); }
  #send{ width:48px; height:48px; border-radius:50%; border:none; background:linear-gradient(135deg,#8b5cf6,#6d3ff5); color:#fff; cursor:pointer;
    box-shadow:0 6px 18px rgba(124,77,255,.4); display:flex; align-items:center; justify-content:center; }
  #send svg{ width:20px; height:20px; }
  @media (max-width:560px){ .tl,.tr{ transform:scale(.9); } .tl{transform-origin:top left;} .tr{transform-origin:top right;} }
  /* ===== โหมดเด็ก (พี่หมี) ===== */
  /* พี่หมีขยับได้ — ลอย + ส่ายหัว + กระพริบตา + ขยับปากตอนพูด (แต่ละชั้นทำหน้าที่เดียว transform ไม่ตีกัน) */
  #bearpos{ position:absolute; left:50%; top:12%; transform:translateX(-50%); width:min(74vw,340px); display:none; z-index:2; pointer-events:none; }
  body.kids #bearpos{ display:block; }
  /* พื้นหลังดำในโหมดเด็ก: ให้ขอบดำของวิดีโอหมีกลืนหายไป (blend ไม่ทำงานกับวิดีโอบนมือถือ) และตรงกับภาพต้นฉบับ */
  body.kids{ background:#000 !important; }
  #bearfloat{ animation:bearfloat 5.5s ease-in-out infinite; }
  #bearglowel{ animation:bearglow 3.4s ease-in-out infinite; }
  #bearpos.spk #bearglowel{ animation-duration:1.1s; }
  #beartalk{ transform-origin:center 62%; }
  #beartalk.talk{ animation:beartalk .3s ease-in-out infinite; }
  /* วิดีโอหมี: พื้นดำถูกเอาออกด้วย mix-blend-mode:screen ให้ลอยบนพื้นแอป (ไม่ใช้ drop-shadow เพราะวิดีโอเป็นสี่เหลี่ยมทึบ) */
  #bearimg{ width:100%; display:block; transform-origin:center 46%; mix-blend-mode:screen; border-radius:12px; }
  @keyframes bearfloat{ 0%,100%{ transform:translate(-5px,0) rotate(-2.6deg); } 25%{ transform:translate(0,-13px) rotate(0deg); } 50%{ transform:translate(5px,0) rotate(2.6deg); } 75%{ transform:translate(0,-13px) rotate(0deg); } }
  @keyframes bearglow{ 0%,100%{ filter:brightness(1) saturate(1); } 50%{ filter:brightness(1.13) saturate(1.18); } }
  @keyframes beartalk{ 0%,100%{ transform:scaleY(1) scaleX(1); } 50%{ transform:scaleY(.94) scaleX(1.03); } }
  .kidlabel{ position:absolute; top:52px; left:0; right:0; text-align:center; pointer-events:none; display:none; z-index:3; }
  .kidlabel b{ font-family:"Kanit",sans-serif; font-size:26px; font-weight:700; color:#fff; text-shadow:0 0 20px rgba(216,120,255,.7); }
  .kidlabel span{ display:block; font-size:14px; color:#e6c8ff; margin-top:2px; }
  body.kids .title, body.kids .panel, body.kids .status{ display:none !important; }
  body.kids .kidlabel{ display:block; }
  /* ===== 2 โหมด: คุย / เล่นเกม + แถบหมวด + ล็อกผู้ปกครอง ===== */
  #kidtabs{ position:absolute; left:0; right:0; display:none; gap:10px; justify-content:center; z-index:9; pointer-events:none; bottom:120px; }
  body.kids #kidtabs{ display:flex; }
  body.kids.play #kidtabs{ bottom:auto; top:18px; }
  #kidtabs button{ pointer-events:auto; border:1px solid var(--line); background:rgba(20,12,38,.72); color:#cdbff0; border-radius:16px; padding:9px 16px; font-family:"Kanit",sans-serif; font-size:14px; font-weight:600; cursor:pointer; backdrop-filter:blur(8px); }
  #kidtabs button.on{ background:linear-gradient(135deg,#b98bff,#7c3aed); color:#fff; box-shadow:0 4px 16px rgba(124,58,237,.5); }
  .kidlock{ position:absolute; top:14px; left:14px; z-index:9; width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; background:rgba(20,12,38,.7); color:#fff; font-size:16px; display:none; align-items:center; justify-content:center; backdrop-filter:blur(8px); }
  body.kids .kidlock{ display:flex; }
  body.kids.play #bearpos{ width:min(38vw,140px); top:56px; }
  body.kids.play .kidlabel{ display:none; }
  #kids{ position:absolute; left:0; right:0; bottom:118px; display:none; flex-direction:column; align-items:center; gap:9px; padding:0 12px; z-index:8; pointer-events:none; }
  body.kids.play #kids{ display:flex; }
  .kidcats{ display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto; max-width:100%; width:100%; justify-content:flex-start; padding:2px 4px 4px; pointer-events:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .kidcats::-webkit-scrollbar{ display:none; }
  .kidcat{ flex:0 0 auto; }
  .kidcat{ border:none; border-radius:13px; padding:5px 8px; font-family:"Kanit",sans-serif; font-size:11.5px; font-weight:600; color:#fff; cursor:pointer; white-space:nowrap;
    background:rgba(124,77,255,.3); box-shadow:0 3px 12px rgba(124,77,255,.28); display:flex; align-items:center; gap:4px; }
  .kidcat.on{ background:linear-gradient(135deg,#b98bff,#7c3aed); box-shadow:0 5px 18px rgba(124,58,237,.55); }
  .kidcat .ic{ font-size:15px; }
  .kidask{ width:100%; max-width:560px; max-height:40vh; overflow-y:auto; background:rgba(24,14,48,.86); border:1px solid var(--line); border-radius:22px;
    padding:12px; backdrop-filter:blur(12px); box-shadow:0 14px 44px rgba(0,0,0,.5), inset 0 0 24px rgba(216,120,255,.1);
    pointer-events:auto; animation:kidup .3s cubic-bezier(.2,1.1,.3,1); }
  @keyframes kidup{ 0%{ transform:translateY(30px) scale(.94); opacity:0; } 100%{ transform:translateY(0) scale(1); opacity:1; } }
  .kidq{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; text-align:center; font-family:"Kanit",sans-serif; font-size:19px; font-weight:700; color:#fff; text-shadow:0 0 16px rgba(216,120,255,.6); margin-bottom:10px; }
  .quizbtn{ border:1px solid var(--line); background:rgba(255,209,102,.2); color:#ffd93b; border-radius:12px; padding:6px 12px; font-family:"Kanit",sans-serif; font-size:14px; font-weight:600; cursor:pointer; }
  .quizbtn:active{ transform:scale(.94); }
  .tile .big.shp{ font-size:40px; }
  .kidopts{ display:flex; flex-wrap:wrap; gap:9px; justify-content:center; }
  .tile{ width:60px; height:60px; border-radius:16px; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    background:linear-gradient(160deg, rgba(168,85,247,.25), rgba(124,77,255,.18)); box-shadow:0 6px 16px rgba(0,0,0,.3), inset 0 0 14px rgba(216,120,255,.12);
    color:#fff; font-family:"Kanit",sans-serif; transition:transform .12s; }
  .tile:active{ transform:scale(.9); }
  .tile.pop{ animation:pop .5s ease; }
  .tile.on{ background:linear-gradient(160deg, rgba(134,239,172,.35), rgba(22,163,74,.25)); box-shadow:0 0 0 2px rgba(134,239,172,.5), 0 6px 16px rgba(0,0,0,.3); }
  .tile.ok{ background:linear-gradient(160deg, rgba(134,239,172,.5), rgba(22,163,74,.35)); box-shadow:0 0 0 3px rgba(134,239,172,.7), 0 0 26px rgba(74,222,128,.6); }
  .tile.no{ background:linear-gradient(160deg, rgba(255,77,94,.45), rgba(200,30,60,.3)); box-shadow:0 0 0 3px rgba(255,120,140,.7), 0 6px 16px rgba(0,0,0,.3); animation:shake .4s; }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-8px); } 40%{ transform:translateX(8px); } 60%{ transform:translateX(-6px); } 80%{ transform:translateX(6px); } }
  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.22);} 100%{transform:scale(1);} }
  .tile .big{ font-size:28px; line-height:1; }
  .tile .cap{ font-size:11px; font-weight:600; }
  .tile.color .big{ width:36px; height:36px; border-radius:50%; box-shadow:0 0 0 3px rgba(255,255,255,.5); }
  .tile .big.shp{ font-size:34px; }
  .kidx{ position:absolute; top:14px; right:14px; z-index:7; width:44px; height:44px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(20,12,38,.7); color:#fff; font-size:20px; display:none; align-items:center; justify-content:center; backdrop-filter:blur(8px); }
  body.kids .kidx{ display:flex; }
  .kidbar{ display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  .kidbar label{ font-size:11px; color:var(--dim); letter-spacing:.1em; white-space:nowrap; }
  .kidbar input{ flex:1; background:rgba(20,12,38,.92); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px; font-family:inherit; outline:none; }
  .spark{ position:absolute; pointer-events:none; font-size:26px; z-index:8; animation:spark 1s ease forwards; }
  @keyframes spark{ 0%{ transform:translateY(0) scale(.6); opacity:0; } 25%{ opacity:1; } 100%{ transform:translateY(-70px) scale(1.3); opacity:0; } }
  /* ===== โหมดผู้ปกครอง ===== */
  #parentPanel{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(5,3,12,.7); backdrop-filter:blur(6px); z-index:20; }
  #parentPanel.show{ display:flex; }
  .ppanel{ width:min(94vw,420px); max-height:82vh; overflow-y:auto; background:rgba(24,14,48,.97); border:1px solid var(--line); border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .phead{ display:flex; align-items:center; padding:16px 18px; border-bottom:1px solid var(--line); }
  .phead b{ color:#fff; font-size:16px; }
  .phead span{ margin-left:auto; color:var(--dim); font-size:22px; cursor:pointer; }
  #parentBody{ padding:14px 18px; }
  .prow{ margin-bottom:14px; display:flex; flex-direction:column; gap:6px; }
  .prow label{ font-size:13px; color:#cdbff0; }
  .prow input, .prow select{ background:rgba(20,12,38,.92); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:14px; font-family:inherit; outline:none; }
  .loglist{ max-height:32vh; overflow-y:auto; background:rgba(12,7,24,.6); border:1px solid var(--line); border-radius:12px; padding:8px 10px; }
  .logrow{ font-size:13px; color:#e7dffb; padding:4px 0; border-bottom:1px solid rgba(168,85,247,.1); }
  .logrow.dim{ color:var(--dim); border:none; }
  .prow2{ display:flex; gap:10px; }
  .pbtn{ flex:1; border:none; border-radius:12px; padding:11px; font-family:"Kanit",sans-serif; font-size:14px; font-weight:600; color:#fff; cursor:pointer; background:linear-gradient(135deg,#8b5cf6,#6d3ff5); }
  .pbtn.ghost{ background:rgba(124,77,255,.2); color:#cdbff0; border:1px solid var(--line); }
  /* ===== โหมดล่าม/แปลภาษา ===== */
  .xllabel{ position:absolute; top:50px; left:0; right:0; text-align:center; pointer-events:none; display:none; z-index:3; }
  .xllabel b{ font-family:"Orbitron","Kanit",sans-serif; font-size:20px; font-weight:700; color:#fff; letter-spacing:.14em; text-shadow:0 0 18px rgba(124,77,255,.7); }
  .xllabel span{ display:block; font-size:15px; color:#e6c8ff; margin-top:4px; }
  body.xl .title, body.xl .panel, body.xl .status{ display:none !important; }
  body.xl .xllabel{ display:block; }
  #xltext{ position:absolute; left:0; right:0; top:26%; bottom:210px; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:0 22px; z-index:3; text-align:center; }
  body.xl #xltext{ display:flex; }
  .xl-heard{ width:100%; max-width:560px; font-size:15px; color:#9a8dbb; line-height:1.5; max-height:22vh; overflow:hidden; opacity:.9; overflow-wrap:break-word; word-break:break-word; }
  .xl-trans{ width:100%; max-width:560px; font-size:26px; font-weight:600; color:#fff; line-height:1.5; text-shadow:0 0 18px rgba(168,85,247,.5); max-height:36vh; overflow-y:auto; overflow-wrap:break-word; word-break:break-word; }
  .xl-trans:empty::before{ content:"พูดได้เลย… ผมจะแปลให้ทันที"; color:#7d729c; font-size:16px; font-weight:400; }
  #xlbar{ position:absolute; left:0; right:0; bottom:120px; display:none; flex-direction:column; align-items:center; gap:9px; padding:0 14px; z-index:8; }
  body.xl #xlbar{ display:flex; }
  .xlrow{ display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; width:100%; max-width:540px; }
  .xllangsel{ background:rgba(20,12,38,.94); color:var(--txt); border:1px solid var(--line); border-radius:12px; padding:9px 12px; font-size:14px; font-family:inherit; outline:none; }
  .xllangsel:focus{ border-color:var(--vi); }
  .xldir{ border:1px solid var(--line); background:rgba(124,77,255,.22); color:#e7dffb; border-radius:14px; padding:10px 13px; font-size:13px; font-weight:600; font-family:"Kanit",sans-serif; cursor:pointer; display:flex; align-items:center; gap:5px; }
  .xldir:active{ transform:scale(.95); }
  .xldir.on{ background:linear-gradient(135deg,#b98bff,#7c3aed); color:#fff; box-shadow:0 4px 16px rgba(124,58,237,.5); }
  #xlx{ display:none; }
  body.xl #xlx{ display:flex; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="orb"></canvas>
  <div id="bearpos"><div id="bearfloat"><div id="bearglowel"><div id="beartalk"><video id="bearimg" src="bear.mp4" poster="bear.png" autoplay loop muted playsinline webkit-playsinline preload="auto"></video></div></div></div></div>
  <div class="title"><b>F.R.I.D.A.Y</b><span>Live · Realtime</span></div>
  <div class="kidlabel" id="kidlabel"><b>พี่หมี</b><span>เพื่อนคุยของหนู 🐻</span></div>
  <div class="xllabel" id="xllabel"><b>INTERPRETER</b><span id="xlpair">ไทย ⇄ English</span></div>
  <div class="panel tl"><div class="lbl">Local Time</div><div class="clock" id="clock">--:--:--</div><div class="date" id="date">—</div></div>

  /* ---------- ทรงกลมของไหลควันเรืองแสง ---------- */
  var cv=document.getElementById("orb"), cx=cv.getContext("2d"), W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);

  var HUES=["168,85,247","124,77,255","216,120,255"];

  function orbPath(rMul){ cx.beginPath(); var N=96;
    for(var k=0;k<=N;k++){ var ang=k/N*Math.PI*2;
      var wob=1+0.016*Math.sin(ang*5+t*0.9)+0.011*Math.sin(ang*8-t*1.2)+0.007*Math.sin(ang*3+t*0.5);
      var rr=R*rMul*wob; var x=cx0+Math.cos(ang)*rr, y=cy0+Math.sin(ang)*rr;
      if(k===0) cx.moveTo(x,y); else cx.lineTo(x,y); }
    cx.closePath(); }
  function draw(){ t+=0.016; cx.clearRect(0,0,W,H);
    if(kidsMode){ requestAnimationFrame(draw); return; }  /* ใช้รูปหมี (bear.png) แทนการวาด */
    cx0=W/2; cy0=H/2; var base=Math.min(W,H)*0.16; R=base*2.05;
    var speed=mode==="thinking"?2.2:mode==="listening"?1.55:mode==="speaking"?1.9:1;
    var lift=mode==="idle"?0.9:1.15;
    var og=cx.createRadialGradient(cx0,cy0,R*0.25,cx0,cy0,R*2.05);
    og.addColorStop(0,"rgba(150,80,255,"+(0.24*lift)+")"); og.addColorStop(0.5,"rgba(110,50,220,"+(0.09*lift)+")"); og.addColorStop(1,"rgba(90,40,200,0)");
    cx.fillStyle=og; cx.fillRect(0,0,W,H);

    bg.addColorStop(0,"#341a63"); bg.addColorStop(1,"#0a0518"); cx.fillStyle=bg; cx.fillRect(cx0-R*1.2,cy0-R*1.2,2.4*R,2.4*R);
    cx.globalCompositeOperation="lighter";

      var a=t*speed*0.55*b.sp + b.ph*Math.PI;

      cx.fillStyle=g; cx.beginPath(); cx.arc(bx,by,rad,0,7); cx.fill();

    cx.fillStyle=core; cx.beginPath(); cx.arc(cx0,cy0,R*0.7,0,7); cx.fill();
    var rl=cx.createRadialGradient(cx0,cy0,R*0.72,cx0,cy0,R*1.02);
    rl.addColorStop(0,"rgba(200,150,255,0)"); rl.addColorStop(0.8,"rgba(200,150,255,0)"); rl.addColorStop(1,"rgba(220,180,255,0.42)");
    cx.fillStyle=rl; cx.fillRect(cx0-R*1.2,cy0-R*1.2,2.4*R,2.4*R);
    cx.globalCompositeOperation="source-over"; cx.restore();
    requestAnimationFrame(draw);
  }

  /* ===== วาดพี่หมี (canvas) ===== */
  function drawBear(){
    var cxp=W/2, S=Math.min(W,H)*0.17;
    var bob=Math.sin(t*1.4)*S*0.05;
    var cyp=H*0.30 + bob;
    // แสงหลังหมี
    var og=cx.createRadialGradient(cxp,cyp,S*0.3,cxp,cyp,S*3);
    og.addColorStop(0,"rgba(150,80,255,0.20)"); og.addColorStop(1,"rgba(90,40,200,0)");
    cx.fillStyle=og; cx.fillRect(0,0,W,H);
    function ear(ex){ cx.beginPath(); cx.arc(cxp+ex*S*0.72, cyp-S*0.72, S*0.34, 0, 7);
      var g=cx.createRadialGradient(cxp+ex*S*0.72,cyp-S*0.72,2,cxp+ex*S*0.72,cyp-S*0.72,S*0.34);
      g.addColorStop(0,"#a86bff"); g.addColorStop(1,"#6d3ff5"); cx.fillStyle=g; cx.fill();
      cx.beginPath(); cx.arc(cxp+ex*S*0.72, cyp-S*0.68, S*0.16, 0, 7); cx.fillStyle="#d8a6ff"; cx.fill(); }
    ear(-1); ear(1);
    // หัว
    var hg=cx.createRadialGradient(cxp-S*0.3,cyp-S*0.3,S*0.2,cxp,cyp,S*1.15);
    hg.addColorStop(0,"#b98bff"); hg.addColorStop(1,"#6d3ff5");
    cx.beginPath(); cx.arc(cxp,cyp,S,0,7); cx.fillStyle=hg; cx.fill();
    // แก้มชมพู
    cx.globalCompositeOperation="lighter";
    [-1,1].forEach(function(s){ var g=cx.createRadialGradient(cxp+s*S*0.5,cyp+S*0.28,0,cxp+s*S*0.5,cyp+S*0.28,S*0.22);
      g.addColorStop(0,"rgba(255,130,200,0.55)"); g.addColorStop(1,"rgba(255,130,200,0)"); cx.fillStyle=g;
      cx.beginPath(); cx.arc(cxp+s*S*0.5,cyp+S*0.28,S*0.22,0,7); cx.fill(); });
    cx.globalCompositeOperation="source-over";
    // ตา (กระพริบ)
    var blink = (t-blinkT>3)? ( (t-blinkT<3.14)?1:(blinkT=t,0) ) : 0;
    var eyeH = blink? 0.05 : 1;
    [-1,1].forEach(function(s){ cx.save(); cx.translate(cxp+s*S*0.36, cyp-S*0.05); cx.scale(1,eyeH);
      cx.beginPath(); cx.arc(0,0,S*0.11,0,7); cx.fillStyle="#2a1650"; cx.fill();
      cx.beginPath(); cx.arc(-S*0.03,-S*0.03,S*0.035,0,7); cx.fillStyle="#fff"; cx.fill(); cx.restore(); });
    // จมูก
    cx.beginPath(); cx.ellipse(cxp,cyp+S*0.22,S*0.13,S*0.10,0,0,7); cx.fillStyle="#3a2060"; cx.fill();
    // ปาก (อ้าตอนพูด)
    var open = mode==="speaking" ? (0.35+0.3*Math.abs(Math.sin(t*9))) : (mode==="listening"?0.14:0.06);
    cx.beginPath(); cx.ellipse(cxp,cyp+S*0.42,S*0.18,S*open,0,0,7); cx.fillStyle="#e26aa8"; cx.fill();
  }

  /* เล่นเสียงสตรีม 24kHz */
  var playCtx=null, nextTime=0, playing=[];
  function ensurePlay(){ if(!playCtx) playCtx=new (window.AudioContext||window.webkitAudioContext)(); if(playCtx.state==="suspended") playCtx.resume(); return playCtx; }
  function enqueueAudio(b64){ var ctx=ensurePlay(); var bin=atob(b64), n=Math.floor(bin.length/2); if(n<1) return;
    var buf=ctx.createBuffer(1,n,24000), ch=buf.getChannelData(0);
    for(var i=0;i<n;i++){ var v=(bin.charCodeAt(i*2+1)<<8)|bin.charCodeAt(i*2); if(v>=0x8000)v-=0x10000; ch[i]=v/32768; }
    var src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination);
    var start=Math.max(ctx.currentTime, nextTime); src.start(start); nextTime=start+buf.duration; playing.push(src);
    lastActivityTs=Date.now();  /* พี่หมีพูด = มีการใช้งาน */
    setMode("speaking","SPEAKING");
    src.onended=function(){ var i=playing.indexOf(src); if(i>=0) playing.splice(i,1); if(!playing.length && live) setMode(micStream?"listening":"idle", micStream?"LISTENING":"READY"); };
  }
  function stopAudio(){ playing.forEach(function(s){ try{ s.onended=null; s.stop(); }catch(e){} }); playing=[]; nextTime=0; }

  function beep(kind){
    try{ var ctx=ensurePlay(); var now=ctx.currentTime;
      var seq = kind==="ready" ? [[660,0],[990,0.13]]
              : kind==="bye"   ? [[760,0],[500,0.15]]
              :                   [[880,0]];
      seq.forEach(function(p){ var o=ctx.createOscillator(), g=ctx.createGain();
        o.type="sine"; o.frequency.value=p[0]; o.connect(g); g.connect(ctx.destination);
        var st=now+p[1];
        g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.22,st+0.02); g.gain.exponentialRampToValueAtTime(0.0001,st+0.17);
        o.start(st); o.stop(st+0.2);
      });
    }catch(e){}

    bubble("ai sys", AUTO_LISTEN?"✅ เปิดแอปครั้งหน้าจะเริ่มฟังทันที (พูด \"OK Google เปิด Friday\" ได้เลย)":"⏸️ ปิดการเริ่มฟังอัตโนมัติแล้ว — แตะปุ่มไมค์เพื่อคุย"); }; } })();
  (function(){ var c=document.getElementById("loudSpk"); if(c){ c.checked=isLoud(); c.onchange=function(){ setBool("friday_loud", c.checked);
    bubble("ai sys", c.checked?"🔊 โหมดลำโพงดัง — เสียงออกลำโพงใหญ่ (ปิดตัดเสียงสะท้อน + หยุดไมค์ตอน Friday พูด)":"🎧 โหมดปกติ — ตัดเสียงสะท้อน เหมาะกับหูฟัง/พูดแทรกได้ (แต่บนลำโพงอาจเบา/ออกลำโพงหู)");
    if(live && micStream){ stopMic(); startMic().catch(function(){}); } }; } })();
  /* ===== ปุ่มลอย (Native overlay) — แตะเพื่อเรียก Friday จากทุกที่ ===== */
  function bubblePlugin(){ try{ var C=window.Capacitor; if(C&&C.Plugins&&C.Plugins.Bubble) return C.Plugins.Bubble; if(C&&C.registerPlugin) return C.registerPlugin("Bubble"); }catch(e){} return null; }
  var _bubbleOn=false;
  function setBubbleBtn(){ var b=document.getElementById("bubbleBtn"); if(b) b.textContent=_bubbleOn?"🫧 ปิด":"🫧 เปิด"; }
  async function toggleBubble(){
    var B=bubblePlugin();
    if(!B){ bubble("ai err","ปุ่มลอยใช้ได้เฉพาะในแอปเวอร์ชันที่ build ใหม่ (มีโค้ดปุ่มลอยแล้ว)"); openConv(); return; }
    try{
      if(_bubbleOn){ await B.stop(); _bubbleOn=false; setBubbleBtn(); bubble("ai sys","🫧 ปิดปุ่มลอยแล้ว"); return; }
      var h=await B.hasOverlay();
      if(!h || !h.granted){ await B.requestOverlay(); bubble("ai sys","🫧 กรุณาอนุญาต 'แสดงทับแอปอื่น' ให้ Friday แล้วกลับมากด 🫧 เปิด อีกครั้ง"); openConv(); return; }
      await B.start(); _bubbleOn=true; setBubbleBtn(); bubble("ai sys","🫧 เปิดปุ่มลอยแล้ว! แตะปุ่มที่ลอยอยู่เพื่อเรียก Friday จากทุกที่");
    }catch(e){
      var m=(e&&e.message)||String(e);
      if(m.indexOf("overlay")>=0){ try{ await B.requestOverlay(); }catch(_){}
        bubble("ai sys","🫧 อนุญาต 'แสดงทับแอปอื่น' ก่อน แล้วกด 🫧 เปิด อีกครั้ง"); }
      else bubble("ai err","ปุ่มลอย: "+m);
      openConv();
    }
  }
  (function(){ var b=document.getElementById("bubbleBtn"); if(b) b.onclick=toggleBubble; })();
  /* ให้ปุ่มลอย (native) สั่งเริ่มฟังได้ แม้แอปเปิดค้างอยู่แล้ว */
  window.__fridayStartListen = function(){ try{ ensurePlay(); if(!live && !connecting){ stopWake(); stopVoskMic(); connect(true); } }catch(e){} };
  /* ปลดล็อกเสียงเมื่อแตะครั้งแรก (เผื่อ WebView บล็อก autoplay ตอนเปิดอัตโนมัติ) */
  document.addEventListener("touchstart", function(){ try{ ensurePlay(); }catch(e){} }, {passive:true, once:true});
  document.addEventListener("click", function(){ try{ ensurePlay(); }catch(e){} }, {once:true});
  function maybeAutoListen(){
    try{
      var forced=/[?&](listen|go|talk)=1/.test(location.search);
      if(!forced && !AUTO_LISTEN) return;
      if(kidsMode||xlMode) return;
      setTimeout(function(){ if(!live && !connecting){ stopWake(); stopVoskMic(); connect(true); } }, forced?200:450);
    }catch(e){}
  }
  prefetchToken();   /* เริ่มขอ token ทันทีที่โหลด (ขนานกับการโหลดหน้า) เพื่อให้ตอน auto-listen เชื่อมต่อได้เร็ว */
  maybeAutoListen();

  bubble("ai","สวัสดีครับบอส แตะปุ่มคลื่นเสียงเพื่อคุย พอต่อได้ผมจะส่งเสียงบี๊บบอกว่าพร้อมรับคำสั่ง เวลาจะเลิกก็พูดว่า \"จบการสนทนา\" หรือ \"บายบาย\" ได้เลยไม่ต้องกดปุ่ม และเมื่อว่างอยู่พูดว่า \"Friday\" เพื่อปลุกผมได้โดยไม่ต้องแตะจอ");

  /* ===== ตรวจ + เริ่มฟังคำปลุกอัตโนมัติ (BUILD wake-v3.3) ===== */
  var WAKE_STARTED=false;
  function startWakeConfirmed(SR){
    if(WAKE_STARTED) return; WAKE_STARTED=true;
    if(WAKE_OFF){ bubble("ai sys","⏸️ คำปลุกปิดชั่วคราว (กำลังปรับปรุงให้ไม่มีเสียงตื๊ดรบกวน) — ใช้ปุ่มไมค์ไปก่อนได้เลย"); return; }
    wakeEnabled=true;
    bubble("ai sys","🎙️ โหมดคำปลุกเปิดแล้ว — พูดว่า \"Friday\" ได้เลย");
    try{ SR.requestPermissions && SR.requestPermissions(); }catch(e){}
    setTimeout(function(){ if(!live) startWake(); }, 500);
  }
  function initWake(tries){
    if(VOSK_ON){ initVosk(); return; }  /* ใช้ Vosk แทนคำปลุกเนทีฟ */
    var hasCap=!!window.Capacitor, native=isNativeApp(), SR=capSR();
    if(tries===9){ bubble("ai sys","🔎 wake-v3.3 · Capacitor="+(hasCap?"มี":"ไม่มี")+" · native="+(native?"ใช่":"ไม่")+" · plugin="+(SR?"อ้างอิงได้":"ไม่พบ")); }
    if(SR && typeof SR.available==="function"){
      SR.available().then(function(r){
        bubble("ai sys","✅ ปลั๊กอินเสียงพร้อม: "+JSON.stringify(r));
        startWakeConfirmed(SR);
      }).catch(function(e){
        if(tries>0) setTimeout(function(){ initWake(tries-1); }, 600);
        else bubble("ai err","เรียกปลั๊กอินเสียงไม่ได้: "+((e&&e.message)||e)+" — ยังไม่ได้ npm install @capacitor-community/speech-recognition แล้ว sync/build ใหม่?");
      });
      return;
    }
    if(hasCap && tries>0){ setTimeout(function(){ initWake(tries-1); }, 600); return; }
    if(!hasCap){ bubble("ai err","ไม่พบ Capacitor — แอปอาจโหลดหน้าเก่าจากแคช ลองปิดแอปสนิท (ล้างจาก recent) แล้วเปิดใหม่ หรือเช็คว่าอัป live.html ขึ้น GitHub แล้ว"); }
    else { bubble("ai err","หาปลั๊กอินเสียงไม่เจอ (ติดตั้ง @capacitor-community/speech-recognition + sync/build ใหม่)"); }
  }
  setTimeout(function(){ initWake(9); }, 900);
</script>
</body>
