<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>FRIDAY · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0718; --vi:#a855f7; --vi2:#7c4dff; --mag:#d872ff; --dim:#8b7fa8; --txt:#ece7f7;
    --line:rgba(168,85,247,.20); --panel:rgba(30,18,54,.55); --err:#ff7597;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; color:var(--txt);
    background:radial-gradient(ellipse at 50% 32%, #1c1038 0%, #100a22 55%, #070312 100%);
    font-family:"Kanit","Segoe UI",Roboto,"Noto Sans Thai",system-ui,sans-serif; }
  #stage{ position:fixed; inset:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .title{ position:absolute; top:118px; left:0; right:0; text-align:center; pointer-events:none; }
  .title b{ font-family:"Orbitron","Kanit",sans-serif; font-size:17px; font-weight:700; letter-spacing:.14em; color:#fff; text-shadow:0 0 18px rgba(168,85,247,.6); }
  .title span{ display:block; font-family:"Orbitron","Kanit",sans-serif; font-size:9px; font-weight:500; letter-spacing:.3em; color:var(--dim); margin-top:5px; text-transform:uppercase; }
  .status{ position:absolute; left:0; right:0; bottom:126px; text-align:center; padding:0 32px;
    font-size:15px; line-height:1.55; color:#cdbff0; text-shadow:0 0 12px rgba(124,77,255,.4); pointer-events:none; }
  .status .sub{ font-size:12px; letter-spacing:.25em; color:var(--dim); text-transform:uppercase; }
  .panel{ position:absolute; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px 13px;
    backdrop-filter:blur(10px); box-shadow:0 8px 30px rgba(0,0,0,.35), inset 0 0 20px rgba(168,85,247,.05); }
  .panel .lbl{ font-size:9px; letter-spacing:.22em; color:var(--dim); text-transform:uppercase; margin-bottom:3px; }
  .tl{ top:16px; left:16px; min-width:132px; }
  .clock{ font-size:22px; font-weight:600; letter-spacing:.05em; color:#fff; text-shadow:0 0 12px rgba(168,85,247,.4); }
  .date{ font-size:10.5px; color:var(--dim); margin-top:2px; }
  .tr{ top:16px; right:16px; min-width:140px; text-align:right; }
  .temp{ font-size:22px; font-weight:600; color:#fff; }
  .wmeta{ font-size:10.5px; color:var(--dim); margin-top:2px; }
  #conv{ position:absolute; top:0; right:0; height:100%; width:min(380px,90vw); background:rgba(14,8,28,.92); backdrop-filter:blur(14px);
    border-left:1px solid var(--line); transform:translateX(100%); transition:transform .3s ease; display:flex; flex-direction:column; z-index:5; }
  #conv.open{ transform:translateX(0); }
  #conv .head{ padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  #conv .head b{ letter-spacing:.14em; color:#fff; font-size:14px; }
  #conv .head .x{ margin-left:auto; cursor:pointer; color:var(--dim); font-size:20px; }
  .voicebar{ display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  .voicebar label{ font-size:11px; color:var(--dim); letter-spacing:.1em; white-space:nowrap; }
  .voicebar select{ flex:1; background:rgba(20,12,38,.92); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px; font-family:inherit; outline:none; }
  .voicebar select:focus{ border-color:var(--vi); }
  .voicebar button{ border:1px solid var(--line); background:var(--panel); color:#cdbff0; border-radius:10px; padding:8px 10px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .voicebar button svg{ width:20px; height:20px; display:block; }
  .voicebar button:active{ transform:scale(.95); }
  #log{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg{ max-width:86%; padding:11px 14px; font-size:14px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word; }
  .me{ align-self:flex-end; background:linear-gradient(135deg,#8b5cf6,#6d3ff5); color:#fff; border-radius:18px 18px 5px 18px; box-shadow:0 6px 18px rgba(124,77,255,.35); }
  .ai{ align-self:flex-start; background:rgba(255,255,255,.055); border:1px solid rgba(168,85,247,.14); color:#e7dffb; border-radius:18px 18px 18px 5px; }
  .ai.err{ border-color:rgba(255,117,151,.45); color:#ffbdcd; }
  .ai.sys{ align-self:center; background:rgba(124,77,255,.14); color:#c9b6ff; font-size:12px; border-radius:12px; }
  .dock{ position:absolute; left:0; right:0; bottom:30px; display:flex; gap:26px; align-items:center; justify-content:center; z-index:6; }
  .mic{ width:78px; height:78px; border-radius:50%; border:none; cursor:pointer; position:relative;
    background:radial-gradient(circle at 50% 35%, #b98bff, #7c3aed 60%, #5b21b6); color:#fff;
    box-shadow:0 10px 34px rgba(124,58,237,.55), inset 0 -4px 12px rgba(0,0,0,.25); transition:transform .12s;
    display:flex; align-items:center; justify-content:center; }
  .mic:active{ transform:scale(.94); }
  .mic.rec{ background:radial-gradient(circle at 50% 35%, #86efac, #16a34a 60%, #14532d); }
  .eq{ display:flex; align-items:center; gap:4px; height:30px; }
  .eq i{ width:4px; height:10px; border-radius:3px; background:#fff; box-shadow:0 0 8px rgba(255,255,255,.55);
    transform-origin:center; animation:eq 1.4s ease-in-out infinite; }
  .eq i:nth-child(1){ animation-delay:-.9s; } .eq i:nth-child(2){ animation-delay:-.5s; }
  .eq i:nth-child(3){ animation-delay:-.1s; } .eq i:nth-child(4){ animation-delay:-.7s; }
  .eq i:nth-child(5){ animation-delay:-.3s; }
  @keyframes eq{ 0%,100%{ transform:scaleY(.45); } 50%{ transform:scaleY(1.5); } }
  .mic.rec .eq i{ animation-duration:.5s; }
  .sidebtn{ width:52px; height:52px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:#cdbff0;
    cursor:pointer; backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; }
  .sidebtn svg{ width:22px; height:22px; }
  #wrap{ position:absolute; left:16px; right:16px; bottom:118px; display:flex; gap:9px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:6; }
  #wrap.show{ opacity:1; pointer-events:auto; }
  #q{ flex:1; padding:13px 16px; border-radius:24px; border:1px solid var(--line); background:rgba(20,12,38,.9); color:var(--txt); font-size:15px; outline:none; }
  #q:focus{ border-color:var(--vi); box-shadow:0 0 0 3px rgba(124,77,255,.18); }
  #send{ width:48px; height:48px; border-radius:50%; border:none; background:linear-gradient(135deg,#8b5cf6,#6d3ff5); color:#fff; cursor:pointer;
    box-shadow:0 6px 18px rgba(124,77,255,.4); display:flex; align-items:center; justify-content:center; }
  #send svg{ width:20px; height:20px; }
  @media (max-width:560px){ .tl,.tr{ transform:scale(.9); } .tl{transform-origin:top left;} .tr{transform-origin:top right;} }
  /* ===== โหมดเด็ก (พี่หมี) ===== */
  /* พี่หมีขยับได้ — ลอย + ส่ายหัว + กระพริบตา + ขยับปากตอนพูด (แต่ละชั้นทำหน้าที่เดียว transform ไม่ตีกัน) */
  #bearpos{ position:absolute; left:50%; top:12%; transform:translateX(-50%); width:min(74vw,340px); display:none; z-index:2; pointer-events:none; }
  body.kids #bearpos{ display:block; }
  #bearfloat{ animation:bearfloat 5.5s ease-in-out infinite; }
  #bearglowel{ animation:bearglow 3.2s ease-in-out infinite; }
  #bearpos.spk #bearglowel{ animation-duration:1.05s; }
  #beartalk{ transform-origin:center 62%; }
  #beartalk.talk{ animation:beartalk .26s ease-in-out infinite; }
  #bearimg{ width:100%; display:block; transform-origin:center 46%; }
  #bearimg.blink{ animation:bearblink .18s ease-in-out; }
  @keyframes bearfloat{ 0%,100%{ transform:translate(-5px,0) rotate(-2.6deg); } 25%{ transform:translate(0,-13px) rotate(0deg); } 50%{ transform:translate(5px,0) rotate(2.6deg); } 75%{ transform:translate(0,-13px) rotate(0deg); } }
  @keyframes bearglow{ 0%,100%{ filter:drop-shadow(0 0 24px rgba(168,85,247,.5)); } 50%{ filter:drop-shadow(0 0 46px rgba(216,120,255,.92)); } }
  @keyframes beartalk{ 0%,100%{ transform:scaleY(1) scaleX(1); } 50%{ transform:scaleY(.9) scaleX(1.04); } }
  @keyframes bearblink{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(.8); } }
  .kidlabel{ position:absolute; top:52px; left:0; right:0; text-align:center; pointer-events:none; display:none; z-index:3; }
  .kidlabel b{ font-family:"Kanit",sans-serif; font-size:26px; font-weight:700; color:#fff; text-shadow:0 0 20px rgba(216,120,255,.7); }
  .kidlabel span{ display:block; font-size:14px; color:#e6c8ff; margin-top:2px; }
  body.kids .title, body.kids .panel, body.kids .status{ display:none !important; }
  body.kids .kidlabel{ display:block; }
  /* กิจกรรมเด้งขึ้นตามหัวข้อที่พี่หมีชวน (ไม่แสดงค้างตลอด และอยู่เหนือแถบปุ่มล่าง) */
  #kids{ position:absolute; left:0; right:0; bottom:122px; display:none; flex-direction:column; align-items:center; padding:0 14px; z-index:8; pointer-events:none; }
  #kids.show{ display:flex; }
  .kidask{ width:100%; max-width:520px; max-height:46vh; overflow-y:auto; background:rgba(24,14,48,.86); border:1px solid var(--line); border-radius:24px;
    padding:14px 14px 16px; backdrop-filter:blur(12px); box-shadow:0 14px 44px rgba(0,0,0,.5), inset 0 0 24px rgba(216,120,255,.1);
    pointer-events:auto; animation:kidup .34s cubic-bezier(.2,1.1,.3,1); }
  @keyframes kidup{ 0%{ transform:translateY(46px) scale(.9); opacity:0; } 100%{ transform:translateY(0) scale(1); opacity:1; } }
  .kidq{ text-align:center; font-family:"Kanit",sans-serif; font-size:21px; font-weight:700; color:#fff; text-shadow:0 0 16px rgba(216,120,255,.6); margin-bottom:12px; }
  .kidopts{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  .tile{ width:78px; height:78px; border-radius:20px; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:linear-gradient(160deg, rgba(168,85,247,.25), rgba(124,77,255,.18)); box-shadow:0 6px 16px rgba(0,0,0,.3), inset 0 0 14px rgba(216,120,255,.12);
    color:#fff; font-family:"Kanit",sans-serif; transition:transform .12s; }
  .tile:active{ transform:scale(.9); }
  .tile.pop{ animation:pop .5s ease; }
  .tile.on{ background:linear-gradient(160deg, rgba(134,239,172,.35), rgba(22,163,74,.25)); box-shadow:0 0 0 2px rgba(134,239,172,.5), 0 6px 16px rgba(0,0,0,.3); }
  .tile.ok{ background:linear-gradient(160deg, rgba(134,239,172,.5), rgba(22,163,74,.35)); box-shadow:0 0 0 3px rgba(134,239,172,.7), 0 0 26px rgba(74,222,128,.6); }
  .tile.no{ background:linear-gradient(160deg, rgba(255,77,94,.45), rgba(200,30,60,.3)); box-shadow:0 0 0 3px rgba(255,120,140,.7), 0 6px 16px rgba(0,0,0,.3); animation:shake .4s; }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-8px); } 40%{ transform:translateX(8px); } 60%{ transform:translateX(-6px); } 80%{ transform:translateX(6px); } }
  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.22);} 100%{transform:scale(1);} }
  .tile .big{ font-size:34px; line-height:1; }
  .tile .cap{ font-size:13px; font-weight:600; }
  .tile.color .big{ width:44px; height:44px; border-radius:50%; box-shadow:0 0 0 3px rgba(255,255,255,.5); }
  .kidx{ position:absolute; top:14px; right:14px; z-index:7; width:44px; height:44px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(20,12,38,.7); color:#fff; font-size:20px; display:none; align-items:center; justify-content:center; backdrop-filter:blur(8px); }
  body.kids .kidx{ display:flex; }
  .kidbar{ display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  .kidbar label{ font-size:11px; color:var(--dim); letter-spacing:.1em; white-space:nowrap; }
  .kidbar input{ flex:1; background:rgba(20,12,38,.92); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px; font-family:inherit; outline:none; }
  .spark{ position:absolute; pointer-events:none; font-size:26px; z-index:8; animation:spark 1s ease forwards; }
  @keyframes spark{ 0%{ transform:translateY(0) scale(.6); opacity:0; } 25%{ opacity:1; } 100%{ transform:translateY(-70px) scale(1.3); opacity:0; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="orb"></canvas>
  <div id="bearpos"><div id="bearfloat"><div id="bearglowel"><div id="beartalk"><img id="bearimg" src="bear.png" alt="พี่หมี"/></div></div></div></div>
  <div class="title"><b>F.R.I.D.A.Y</b><span>Live · Realtime</span></div>
  <div class="kidlabel" id="kidlabel"><b>พี่หมี</b><span>เพื่อนคุยของหนู 🐻</span></div>
  <div class="panel tl"><div class="lbl">Local Time</div><div class="clock" id="clock">--:--:--</div><div class="date" id="date">—</div></div>
  <div class="panel tr"><div class="lbl">Weather · Bangkok</div><div class="temp" id="temp">--°</div><div class="wmeta" id="wmeta">กำลังโหลด…</div></div>
  <div class="status"><div class="sub">STATUS · <b id="mode">READY</b></div></div>
  <button class="kidx" id="kidx" title="ออกจากโหมดเด็ก">×</button>
  <div id="kids"><div class="kidask"><div class="kidq" id="kidq"></div><div class="kidopts" id="kidopts"></div></div></div>
  <div id="conv"><div class="head"><b>บทสนทนา</b><span class="x" id="convX">×</span></div>
    <div class="voicebar"><label>เสียง</label><select id="voiceSel"></select>
      <button id="voiceTest" title="ลองฟังเสียงนี้">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 6a9 9 0 0 1 0 12"/></svg>
      </button></div>
    <div class="kidbar"><label>ชื่อลูก</label><input id="kidName" placeholder="พิมพ์ชื่อลูก (ถ้ามี) เพื่อให้พี่หมีเรียกชื่อ" autocomplete="off"/></div>
    <div id="log"></div></div>
  <div id="wrap"><input id="q" placeholder="พิมพ์ข้อความ…" autocomplete="off"/>
    <button id="send" title="ส่ง"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
  </div>
  <div class="dock">
    <button class="sidebtn" id="kbd" title="พิมพ์">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 9.5h.01M9 9.5h.01M12 9.5h.01M15 9.5h.01M18 9.5h.01M6.5 14.5h11"/></svg>
    </button>
    <button class="mic" id="mic" title="กดพูด"><span class="eq"><i></i><i></i><i></i><i></i><i></i></span></button>
    <button class="sidebtn" id="convToggle" title="บทสนทนา">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a8.5 8.5 0 0 1-.9-4A8.38 8.38 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/></svg>
    </button>
  </div>
</div>
<script type="module">
  import { GoogleGenAI } from "https://esm.sh/@google/genai";

  var LIVE_TOKEN="https://nysgeaazltcuhwaottmy.supabase.co/functions/v1/live-token";

  function setPass(p){ try{ localStorage.setItem("jarvis_pass", p); }catch(e){} }
  function ensurePass(){ var p=getPass(); if(!p){ p=prompt("ใส่รหัสผ่านผู้ช่วย (passphrase)")||""; if(p) setPass(p); } return p; }

  /* ---------- ทรงกลมของไหลควันเรืองแสง ---------- */
  var cv=document.getElementById("orb"), cx=cv.getContext("2d"), W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
  function resize(){ W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener("resize", resize); resize();
  var mode="idle", t=0;
  var kidsMode=false, blinkT=0;
  var blobs=[]; for(var i=0;i<16;i++){ blobs.push({ ph:i*0.7, sp:0.5+((i*37)%50)/100, rad:0.30+((i*29)%40)/100, orb:0.20+((i*53)%55)/100, hue:i%3 }); }
  var HUES=["168,85,247","124,77,255","216,120,255"];
  var cx0=0, cy0=0, R=0;
  function orbPath(rMul){ cx.beginPath(); var N=96;
    for(var k=0;k<=N;k++){ var ang=k/N*Math.PI*2;
      var wob=1+0.016*Math.sin(ang*5+t*0.9)+0.011*Math.sin(ang*8-t*1.2)+0.007*Math.sin(ang*3+t*0.5);
      var rr=R*rMul*wob; var x=cx0+Math.cos(ang)*rr, y=cy0+Math.sin(ang)*rr;
      if(k===0) cx.moveTo(x,y); else cx.lineTo(x,y); }

  function draw(){ t+=0.016; cx.clearRect(0,0,W,H);
    if(kidsMode){ requestAnimationFrame(draw); return; }  /* ใช้รูปหมี (bear.png) แทนการวาด */
    cx0=W/2; cy0=H/2; var base=Math.min(W,H)*0.16; R=base*2.05;
    var speed=mode==="thinking"?2.2:mode==="listening"?1.55:mode==="speaking"?1.9:1;
    var lift=mode==="idle"?0.9:1.15;
    var og=cx.createRadialGradient(cx0,cy0,R*0.25,cx0,cy0,R*2.05);
    og.addColorStop(0,"rgba(150,80,255,"+(0.24*lift)+")"); og.addColorStop(0.5,"rgba(110,50,220,"+(0.09*lift)+")"); og.addColorStop(1,"rgba(90,40,200,0)");
    cx.fillStyle=og; cx.fillRect(0,0,W,H);
    cx.save(); orbPath(1); cx.clip();
    var bg=cx.createRadialGradient(cx0-R*0.32,cy0-R*0.32,R*0.1,cx0,cy0,R*1.05);
    bg.addColorStop(0,"#341a63"); bg.addColorStop(1,"#0a0518"); cx.fillStyle=bg; cx.fillRect(cx0-R*1.2,cy0-R*1.2,2.4*R,2.4*R);
    cx.globalCompositeOperation="lighter";
    for(var i=0;i<blobs.length;i++){ var b=blobs[i];
      var a=t*speed*0.55*b.sp + b.ph*Math.PI;
      var rr=R*b.orb*(0.6+0.4*Math.sin(t*0.7*b.sp+b.ph*3));
      var bx=cx0+Math.cos(a)*rr, by=cy0+Math.sin(a*1.08+b.ph)*rr;
      var rad=R*(b.rad*(0.8+0.3*Math.sin(t*1.1+b.ph*2)))*lift;
      var g=cx.createRadialGradient(bx,by,0,bx,by,rad); var hue=HUES[b.hue];
      g.addColorStop(0,"rgba("+hue+",0.20)"); g.addColorStop(0.6,"rgba("+hue+",0.06)"); g.addColorStop(1,"rgba("+hue+",0)");
      cx.fillStyle=g; cx.beginPath(); cx.arc(bx,by,rad,0,7); cx.fill();
    }
    var pc=0.42+0.14*Math.sin(t*(mode==="speaking"?6:3));
    var core=cx.createRadialGradient(cx0,cy0-R*0.05,0,cx0,cy0,R*0.7);
    core.addColorStop(0,"rgba(236,214,255,"+pc+")"); core.addColorStop(0.4,"rgba(168,90,255,0.22)"); core.addColorStop(1,"rgba(120,60,230,0)");
    cx.fillStyle=core; cx.beginPath(); cx.arc(cx0,cy0,R*0.7,0,7); cx.fill();
    var rl=cx.createRadialGradient(cx0,cy0,R*0.72,cx0,cy0,R*1.02);
    rl.addColorStop(0,"rgba(200,150,255,0)"); rl.addColorStop(0.8,"rgba(200,150,255,0)"); rl.addColorStop(1,"rgba(220,180,255,0.42)");

  function drawBear(){
    var cxp=W/2, S=Math.min(W,H)*0.17;
    var bob=Math.sin(t*1.4)*S*0.05;
    var cyp=H*0.30 + bob;
    // แสงหลังหมี
    var og=cx.createRadialGradient(cxp,cyp,S*0.3,cxp,cyp,S*3);
    og.addColorStop(0,"rgba(150,80,255,0.20)"); og.addColorStop(1,"rgba(90,40,200,0)");
    cx.fillStyle=og; cx.fillRect(0,0,W,H);
    function ear(ex){ cx.beginPath(); cx.arc(cxp+ex*S*0.72, cyp-S*0.72, S*0.34, 0, 7);
      var g=cx.createRadialGradient(cxp+ex*S*0.72,cyp-S*0.72,2,cxp+ex*S*0.72,cyp-S*0.72,S*0.34);
      g.addColorStop(0,"#a86bff"); g.addColorStop(1,"#6d3ff5"); cx.fillStyle=g; cx.fill();
      cx.beginPath(); cx.arc(cxp+ex*S*0.72, cyp-S*0.68, S*0.16, 0, 7); cx.fillStyle="#d8a6ff"; cx.fill(); }
    ear(-1); ear(1);
    // หัว
    var hg=cx.createRadialGradient(cxp-S*0.3,cyp-S*0.3,S*0.2,cxp,cyp,S*1.15);
    hg.addColorStop(0,"#b98bff"); hg.addColorStop(1,"#6d3ff5");
    cx.beginPath(); cx.arc(cxp,cyp,S,0,7); cx.fillStyle=hg; cx.fill();
    // แก้มชมพู
    cx.globalCompositeOperation="lighter";
    [-1,1].forEach(function(s){ var g=cx.createRadialGradient(cxp+s*S*0.5,cyp+S*0.28,0,cxp+s*S*0.5,cyp+S*0.28,S*0.22);
      g.addColorStop(0,"rgba(255,130,200,0.55)"); g.addColorStop(1,"rgba(255,130,200,0)"); cx.fillStyle=g;
      cx.beginPath(); cx.arc(cxp+s*S*0.5,cyp+S*0.28,S*0.22,0,7); cx.fill(); });
    cx.globalCompositeOperation="source-over";
    // ตา (กระพริบ)
    var blink = (t-blinkT>3)? ( (t-blinkT<3.14)?1:(blinkT=t,0) ) : 0;
    var eyeH = blink? 0.05 : 1;
    [-1,1].forEach(function(s){ cx.save(); cx.translate(cxp+s*S*0.36, cyp-S*0.05); cx.scale(1,eyeH);
      cx.beginPath(); cx.arc(0,0,S*0.11,0,7); cx.fillStyle="#2a1650"; cx.fill();
      cx.beginPath(); cx.arc(-S*0.03,-S*0.03,S*0.035,0,7); cx.fillStyle="#fff"; cx.fill(); cx.restore(); });
    // จมูก
    cx.beginPath(); cx.ellipse(cxp,cyp+S*0.22,S*0.13,S*0.10,0,0,7); cx.fillStyle="#3a2060"; cx.fill();
    // ปาก (อ้าตอนพูด)
    var open = mode==="speaking" ? (0.35+0.3*Math.abs(Math.sin(t*9))) : (mode==="listening"?0.14:0.06);
    cx.beginPath(); cx.ellipse(cxp,cyp+S*0.42,S*0.18,S*open,0,0,7); cx.fillStyle="#e26aa8"; cx.fill();
  }

  async function startVoskMic(){
    if(!voskLoaded || live || voskStream) return;
    try{
      voskStream=await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, channelCount:1 } });
      voskCtx=new (window.AudioContext||window.webkitAudioContext)();
      voskRec=new voskModel.KaldiRecognizer(voskCtx.sampleRate);
      try{ voskRec.setWords && voskRec.setWords(true); }catch(e){}
      voskRec.on("partialresult", function(m){ var t=m&&m.result&&m.result.partial; if(t) matchWake(t); });
      voskRec.on("result", function(m){ var t=m&&m.result&&m.result.text; if(t) matchWake(t); });
      voskSrc=voskCtx.createMediaStreamSource(voskStream);
      voskNode=voskCtx.createScriptProcessor(4096,1,1);
      voskNode.onaudioprocess=function(ev){ try{ voskRec && voskRec.acceptWaveform(ev.inputBuffer); }catch(e){} };
      voskSrc.connect(voskNode); voskNode.connect(voskCtx.destination);
      if(!live) setMode("idle",'READY · พูด "FRIDAY"');
    }catch(e){ bubble("ai err","เปิดไมค์คำปลุกไม่ได้: "+((e&&e.message)||e)); }
  }
  function stopVoskMic(){
    try{ voskNode&&voskNode.disconnect(); }catch(e){}
    try{ voskSrc&&voskSrc.disconnect(); }catch(e){}
    try{ voskStream&&voskStream.getTracks().forEach(function(t){t.stop();}); }catch(e){}
    try{ voskCtx&&voskCtx.close(); }catch(e){}
    voskNode=voskSrc=voskStream=voskCtx=null;
  }

  function canonToken(kind,token){ token=String(token==null?"":token).trim();

    if(kind==="animals"){ var a=ANIMAL_MAP[token]||ANIMAL_MAP[token.toLowerCase()]; return a?a[1]:token.toLowerCase(); }
    if(kind==="english"){ var e=ENG_MAP[token.toLowerCase()]; return e?token.toLowerCase():token.toLowerCase(); }

  function buildOptions(kind,answer,options){ var ans=String(answer).trim();
    if(options && options.length){ return options.map(String); }

    for(var i=0;i<pool.length;i++){ if(canonToken(kind,pool[i])===ac){ ansTok=pool[i]; break; } }

  var LULL=[["C",2],["C",2],["G",2],["G",2],["A",2],["A",2],["G",4],["F",2],["F",2],["E",2],["E",2],["D",2],["D",2],["C",4],
            ["G",2],["G",2],["F",2],["F",2],["E",2],["E",2],["D",4],["G",2],["G",2],["F",2],["F",2],["E",2],["E",2],["D",4]];
  var lull={on:false, timer:null};
  function lullNote(ctx,f,start,dur){ var o=ctx.createOscillator(), g=ctx.createGain(); o.type="triangle"; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001,start); g.gain.exponentialRampToValueAtTime(0.12,start+0.06); g.gain.exponentialRampToValueAtTime(0.0001,start+dur*0.92); o.start(start); o.stop(start+dur); }
  function startLull(){ if(lull.on) return; lull.on=true; var ctx=ensurePlay();
    (function loop(){ if(!lull.on) return; var t0=ctx.currentTime+0.08, beat=0.36, tot=0;
      LULL.forEach(function(n){ lullNote(ctx, NOTE[n[0]], t0+tot, n[1]*beat*0.9); tot+=n[1]*beat; });
      lull.timer=setTimeout(loop, (tot+0.6)*1000); })(); }
  function stopLull(){ lull.on=false; if(lull.timer){ clearTimeout(lull.timer); lull.timer=null; } }
  var kidsEl=document.getElementById("kids"), kidqEl=document.getElementById("kidq"), koptsEl=document.getElementById("kidopts"), curQuiz=null;
  function showKidPanel(){ kidsEl.classList.add("show"); }
  function hideKidPanel(){ kidsEl.classList.remove("show"); koptsEl.innerHTML=""; kidqEl.textContent=""; curQuiz=null; }
  function browseSay(kind,tok){
    if(kind==="numbers") return "เด็กแตะเลข "+tok+" ช่วยพูดเลข "+tok+" ดังๆ ชัดๆ บอกภาษาอังกฤษด้วย ชวนเด็กพูดตาม แล้วชม";
    if(kind==="colors"){ var c=COLOR_MAP[tok]; return "เด็กแตะสี"+tok+" บอกว่านี่คือสี"+tok+" ภาษาอังกฤษว่า "+(c?c[1]:tok)+" ชวนเด็กพูดตาม แล้วชม"; }
    if(kind==="animals"){ var a=ANIMAL_MAP[tok]; return "เด็กแตะรูป"+tok+" บอกชื่อสัตว์นี้ ("+tok+" = "+(a?a[1]:tok)+") แล้วทำเสียงร้องสนุกๆ ชวนเด็กทำเสียงตาม แล้วชม"; }
    if(kind==="english"){ var e=ENG_MAP[String(tok).toLowerCase()]; return "เด็กแตะรูป "+(e?e[1]:tok)+" สอนคำอังกฤษว่า "+tok+" พูดช้าๆ ให้เด็กพูดตาม แล้วชม"; }
    return "เด็กแตะ "+tok;
  }
  /* โชว์แผงให้เด็กสำรวจ (ไม่มีถูก/ผิด) */
  function showActivity(type){
    if(!kidsMode) return;
    if(type==="hide"||!type){ hideKidPanel(); return; }
    var kind=({num:"numbers",number:"numbers",numbers:"numbers",color:"colors",colors:"colors",animal:"animals",animals:"animals",eng:"english",english:"english"})[type]||type;
    curQuiz=null;
    var titleMap={numbers:"มาเรียนนับเลขกัน 🔢",colors:"มาเรียนสีกัน 🎨",animals:"มารู้จักสัตว์กัน 🐾",english:"คำศัพท์อังกฤษ 🔤"};
    kidqEl.textContent=titleMap[kind]||"มาเล่นกัน 🎈"; koptsEl.innerHTML="";
    poolFor(kind).forEach(function(tok){ var t=kidTile(kind,tok);
      t.onclick=function(ev){ t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop"); sparkle(ev); ensurePlay(); beep("ready"); sendKid(browseSay(kind,tok)); };
      koptsEl.appendChild(t); });
    showKidPanel();
  }
  /* ตั้งคำถามให้เด็กแตะเลือก แล้วบอกกลับว่าถูก/ผิด */
  function askQuestion(kind,answer,options,prompt){
    if(!kidsMode) return;
    kind=({num:"numbers",number:"numbers",color:"colors",animal:"animals",eng:"english"})[kind]||kind||"numbers";
    curQuiz={ kind:kind, answer:String(answer), ans:canonToken(kind,answer) };
    kidqEl.textContent=prompt||("แตะ "+answer); koptsEl.innerHTML="";
    buildOptions(kind,answer,options).forEach(function(tok){ var t=kidTile(kind,tok);
      t.onclick=function(ev){ onKidAnswer(t,ev); }; koptsEl.appendChild(t); });
    showKidPanel();
  }
  function onKidAnswer(tile,ev){
    if(!curQuiz) return; ensurePlay(); sparkle(ev);
    var picked=tile.dataset.canon, label=tile.dataset.label||picked;
    if(picked===curQuiz.ans){
      tile.classList.add("ok"); beep("ready");
      Array.prototype.forEach.call(koptsEl.children,function(c){ c.onclick=null; });
      curQuiz=null;
      sendKid('[กิจกรรม] เด็กตอบถูก แตะ "'+label+'" ถูกต้อง! ช่วยชมเด็กสั้นๆ อบอุ่น (เช่น เก่งมากเลย!) สอดคำอังกฤษของคำตอบ แล้วชวนเล่นข้อต่อไป (เรียก ask_question ใหม่ หรือ show_activity)');
      setTimeout(hideKidPanel, 1100);
    } else {
      tile.classList.add("no"); tile.style.pointerEvents="none"; beep("bye");
      sendKid('[กิจกรรม] เด็กแตะผิด (ตอบ "'+label+'" แต่คำตอบที่ถูกคือ "'+curQuiz.answer+'") ช่วยพูดปลอบใจอ่อนโยน ไม่ดุ ใบ้คำตอบนิดหน่อย แล้วชวนให้ลองอีกครั้ง');
      setTimeout(function(){ tile.classList.remove("no"); tile.style.pointerEvents=""; }, 1300);
    }
  }
  function sparkle(ev){ var s=document.createElement("div"); s.className="spark"; s.textContent=["⭐","✨","🌟","💫"][Math.floor(Math.random()*4)];
    var x=(ev&&ev.clientX)||W/2, y=(ev&&ev.clientY)||H/2; s.style.left=(x-13)+"px"; s.style.top=(y-13)+"px"; document.body.appendChild(s); setTimeout(function(){ s.remove(); },1000); }
  function sendKid(text){
    if(session && live){ try{ session.sendClientContent({ turns:[{ role:"user", parts:[{ text:text }] }], turnComplete:true }); setMode("thinking","คิดอยู่…"); }catch(e){} }
    else { pendingText=text; ensurePlay(); connect(false); }
  }
  function setKidsMode(on){
    kidsMode=!!on; document.body.classList.toggle("kids", kidsMode);
    try{ hideKidPanel(); }catch(e){}
    if(!kidsMode){ try{ stopLull(); }catch(e){} }
    if(live) endLive(false);
    setMode("idle", kidsMode?"พร้อมเล่น":"READY");
  }
  document.getElementById("kidx").onclick=function(){ switchModeVoice(false); };
  /* สั่งด้วยเสียง: เข้า/ออกโหมดเด็ก */
  var KIDS_IN=["โหมดเด็ก","โหมดพี่หมี","เข้าโหมดเด็ก","เปิดโหมดเด็ก","คุยกับเด็ก","โหมดลูก","โหมดสำหรับเด็ก","เปิดพี่หมี","คุยกับพี่หมี","เรียกพี่หมี","kidsmode"];
  var KIDS_OUT=["ออกจากโหมดเด็ก","ออกโหมดเด็ก","ปิดโหมดเด็ก","โหมดปกติ","โหมดผู้ใหญ่","กลับโหมดปกติ","ออกจากพี่หมี","เลิกโหมดเด็ก","กลับมาปกติ"];
  var _modeSwitching=false;
  function switchModeVoice(toKids){
    _modeSwitching=true;
    setKidsMode(toKids); beep("ready");
    var greet = toKids ? "แนะนำตัวสั้นๆ ว่าเป็น 'พี่หมี' เพื่อนหมีใจดี ทักทายเด็กน่ารักๆ ชวนเล่นเบาๆ"
                       : "บอกสั้นๆ ว่ากลับมาโหมดปกติแล้วครับบอส";
    setTimeout(function(){ pendingText=greet; connect(true); }, 500);
    setTimeout(function(){ _modeSwitching=false; }, 3000);
  }
  function checkKidsMusic(txt){
    if(!kidsMode) return; var n=norm(txt);
    if(["เปิดเพลงกล่อม","เปิดดนตรีกล่อม","เปิดเพลงนอน","เปิดดนตรีนอน","เปิดเพลงกล่อมนอน","เปิดดนตรีกล่อมนอน","เปิดดนตรี"].some(function(w){ return n.indexOf(norm(w))>=0; })){ startLull(); }
    else if(["ปิดเพลง","หยุดเพลง","หยุดดนตรี","ปิดดนตรี","ปิดเพลงกล่อม"].some(function(w){ return n.indexOf(norm(w))>=0; })){ stopLull(); }
  }
  function checkModeSwitch(txt){
    if(_modeSwitching) return;
    var n=norm(txt);
    if(!kidsMode && KIDS_IN.some(function(w){ return n.indexOf(norm(w))>=0; })){ switchModeVoice(true); }
    else if(kidsMode && KIDS_OUT.some(function(w){ return n.indexOf(norm(w))>=0; })){ switchModeVoice(false); }
  }
  var kidNameEl=document.getElementById("kidName");
  if(kidNameEl){ kidNameEl.value=kidName; kidNameEl.addEventListener("change",function(){ kidName=kidNameEl.value.trim(); try{ localStorage.setItem("friday_kid_name", kidName); }catch(e){} }); }
  try{ if(/[?&]kids=1/.test(location.search)) setKidsMode(true); }catch(e){}

  bubble("ai","สวัสดีครับบอส แตะปุ่มคลื่นเสียงเพื่อคุย พอต่อได้ผมจะส่งเสียงบี๊บบอกว่าพร้อมรับคำสั่ง เวลาจะเลิกก็พูดว่า \"จบการสนทนา\" หรือ \"บายบาย\" ได้เลยไม่ต้องกดปุ่ม และเมื่อว่างอยู่พูดว่า \"Friday\" เพื่อปลุกผมได้โดยไม่ต้องแตะจอ");

  /* ===== ตรวจ + เริ่มฟังคำปลุกอัตโนมัติ (BUILD wake-v3.3) ===== */
  var WAKE_STARTED=false;
  function startWakeConfirmed(SR){
    if(WAKE_STARTED) return; WAKE_STARTED=true;
    if(WAKE_OFF){ bubble("ai sys","⏸️ คำปลุกปิดชั่วคราว (กำลังปรับปรุงให้ไม่มีเสียงตื๊ดรบกวน) — ใช้ปุ่มไมค์ไปก่อนได้เลย"); return; }
    wakeEnabled=true;
    bubble("ai sys","🎙️ โหมดคำปลุกเปิดแล้ว — พูดว่า \"Friday\" ได้เลย");
    try{ SR.requestPermissions && SR.requestPermissions(); }catch(e){}
    setTimeout(function(){ if(!live) startWake(); }, 500);
  }
  function initWake(tries){
    if(VOSK_ON){ initVosk(); return; }  /* ใช้ Vosk แทนคำปลุกเนทีฟ */
    var hasCap=!!window.Capacitor, native=isNativeApp(), SR=capSR();
    if(tries===9){ bubble("ai sys","🔎 wake-v3.3 · Capacitor="+(hasCap?"มี":"ไม่มี")+" · native="+(native?"ใช่":"ไม่")+" · plugin="+(SR?"อ้างอิงได้":"ไม่พบ")); }
    if(SR && typeof SR.available==="function"){
      SR.available().then(function(r){
        bubble("ai sys","✅ ปลั๊กอินเสียงพร้อม: "+JSON.stringify(r));
        startWakeConfirmed(SR);
      }).catch(function(e){
        if(tries>0) setTimeout(function(){ initWake(tries-1); }, 600);
        else bubble("ai err","เรียกปลั๊กอินเสียงไม่ได้: "+((e&&e.message)||e)+" — ยังไม่ได้ npm install @capacitor-community/speech-recognition แล้ว sync/build ใหม่?");
      });
      return;
    }
    if(hasCap && tries>0){ setTimeout(function(){ initWake(tries-1); }, 600); return; }
    if(!hasCap){ bubble("ai err","ไม่พบ Capacitor — แอปอาจโหลดหน้าเก่าจากแคช ลองปิดแอปสนิท (ล้างจาก recent) แล้วเปิดใหม่ หรือเช็คว่าอัป live.html ขึ้น GitHub แล้ว"); }
    else { bubble("ai err","หาปลั๊กอินเสียงไม่เจอ (ติดตั้ง @capacitor-community/speech-recognition + sync/build ใหม่)"); }
  }
  setTimeout(function(){ initWake(9); }, 900);
</script>
</body>
